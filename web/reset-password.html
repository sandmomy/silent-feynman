<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — BookVoice</title>
    <meta name="description" content="Choose a new password for your BookVoice account." />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta property="og:title" content="Reset password — BookVoice" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://book.eugenemierak.com/reset-password" />
    <link rel="icon" href="/icons/bookvoice-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/bookvoice-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Manrope, system-ui, sans-serif; background: #0b0b0f; color: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { width: 100%; max-width: 420px; background: #131319; border: 1px solid #1f1f27; border-radius: 18px; padding: 32px; }
      h1 { margin: 0 0 8px; font-size: 22px; color: #2dd4bf; }
      p { color: #7c7c88; font-size: 14px; line-height: 1.5; margin: 4px 0 20px; }
      label { display: block; font-size: 13px; color: #7c7c88; margin: 14px 0 6px; }
      input { width: 100%; padding: 12px 14px; background: #0b0b0f; border: 1px solid #1f1f27; border-radius: 10px; color: #f5f5f7; font-size: 15px; font-family: inherit; }
      input:focus { outline: none; border-color: #2dd4bf; }
      button { width: 100%; padding: 12px; background: #2dd4bf; color: #0b0b0f; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 20px; font-family: inherit; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .ok { color: #4ade80; font-size: 14px; margin-top: 14px; }
      .err { color: #f87171; font-size: 14px; margin-top: 14px; }
      .back { display: inline-block; margin-top: 20px; color: #7c7c88; font-size: 13px; text-decoration: none; }
      .back:hover { color: #2dd4bf; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Reset your password</h1>
      <p>Enter a new password for your BookVoice account. It must be at least 8 characters.</p>
      <form id="resetForm">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required />
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" minlength="8" autocomplete="new-password" required />
        <button type="submit" id="submitBtn">Set new password</button>
      </form>
      <div id="status"></div>
      <a class="back" href="/">← Back to BookVoice</a>
    </div>
    <script>
      (function () {
        var qs = new URLSearchParams(location.search);
        var token = qs.get("token");
        var statusEl = document.getElementById("status");
        var form = document.getElementById("resetForm");
        var btn = document.getElementById("submitBtn");
        if (!token) {
          statusEl.innerHTML = '<p class="err">Missing token. Request a new reset link.</p>';
          form.style.display = "none";
          return;
        }
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          var pw = document.getElementById("password").value;
          var cf = document.getElementById("confirm").value;
          if (pw.length < 8) { statusEl.innerHTML = '<p class="err">Password must be at least 8 characters.</p>'; return; }
          if (pw !== cf) { statusEl.innerHTML = '<p class="err">Passwords do not match.</p>'; return; }
          btn.disabled = true;
          statusEl.innerHTML = "";
          try {
            var res = await fetch("/api/auth/password/reset", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: token, password: pw }),
            });
            var data = await res.json().catch(function () { return {}; });
            if (res.ok) {
              statusEl.innerHTML = '<p class="ok">Password updated. You can now sign in.</p>';
              form.style.display = "none";
            } else {
              statusEl.innerHTML = '<p class="err">' + (data.error === "invalid_or_expired_token" ? "Link expired or invalid. Request a new one." : "Could not reset. Try again.") + '</p>';
              btn.disabled = false;
            }
          } catch (err) {
            statusEl.innerHTML = '<p class="err">Network error. Try again.</p>';
            btn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
