<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot password — BookVoice</title>
    <meta name="description" content="Receive a reset link to recover your BookVoice account." />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta property="og:title" content="Forgot password — BookVoice" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://book.eugenemierak.com/forgot-password" />
    <link rel="icon" href="/icons/bookvoice-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/bookvoice-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Manrope, system-ui, sans-serif; background: #0b0b0f; color: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { width: 100%; max-width: 420px; background: #131319; border: 1px solid #1f1f27; border-radius: 18px; padding: 32px; }
      h1 { margin: 0 0 8px; font-size: 22px; color: #2dd4bf; }
      p { color: #7c7c88; font-size: 14px; line-height: 1.5; margin: 4px 0 20px; }
      label { display: block; font-size: 13px; color: #7c7c88; margin: 14px 0 6px; }
      input { width: 100%; padding: 12px 14px; background: #0b0b0f; border: 1px solid #1f1f27; border-radius: 10px; color: #f5f5f7; font-size: 15px; font-family: inherit; }
      input:focus { outline: none; border-color: #2dd4bf; }
      button { width: 100%; padding: 12px; background: #2dd4bf; color: #0b0b0f; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 20px; font-family: inherit; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .ok { color: #4ade80; font-size: 14px; margin-top: 14px; }
      .back { display: inline-block; margin-top: 20px; color: #7c7c88; font-size: 13px; text-decoration: none; }
      .back:hover { color: #2dd4bf; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Forgot your password?</h1>
      <p>Enter your email and we'll send you a reset link. If we find an account, you'll receive it within a few minutes.</p>
      <form id="forgotForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
        <button type="submit" id="submitBtn">Send reset link</button>
      </form>
      <div id="status"></div>
      <a class="back" href="/">← Back to BookVoice</a>
    </div>
    <script>
      (function () {
        var form = document.getElementById("forgotForm");
        var btn = document.getElementById("submitBtn");
        var statusEl = document.getElementById("status");
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          btn.disabled = true;
          statusEl.innerHTML = "";
          var email = document.getElementById("email").value.trim();
          try {
            await fetch("/api/auth/password/forgot", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ identifier: email }),
            });
          } catch (err) {}
          statusEl.innerHTML = '<p class="ok">If an account exists for that email, we just sent a reset link. Check your inbox (and spam).</p>';
          form.style.display = "none";
        });
      })();
    </script>
  </body>
</html>
