<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frequency Vibes — Reels Controller</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0c0a14;
    --panel: #16151f;
    --panel-2: #1d1d28;
    --panel-elev: #20212e;
    --line: #2a2c3a;
    --line-soft: rgba(255,255,255,0.06);
    --text: #e7e6e0;
    --dim: #8b8a82;
    --gold: #d4a866;
    --gold-soft: rgba(212,168,102,0.08);
    --teal: #6fcfc7;
    --purple: #8a7bd8;
    --purple-soft: rgba(138,123,216,0.08);
    --ok: #6fcf97;
    --warn: #e0b674;
    --err: #d57878;
    --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;

    --transition: 180ms cubic-bezier(0.2, 0.6, 0.2, 1);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 36px rgba(0,0,0,0.55);
    --inset-hi: inset 0 1px 0 rgba(255,255,255,0.025);
  }
  * { box-sizing: border-box; }
  *::selection { background: rgba(212,168,102,0.28); color: var(--text); }
  html {
    margin: 0;
    background: var(--bg);
    min-height: 100vh;
  }
  body {
    margin: 0;
    background: transparent;
    color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    isolation: isolate;
  }

  /* Animated mesh background — three drifting color blobs (gold, purple, teal)
     using transform-only animation so it stays GPU-cheap. The wrappers extend
     -50%..150% beyond the viewport so translation never reveals an edge. */
  /* SVG-based animated aurora — three large blobs morph in independent paths
     and merge organically thanks to the "goo" filter (blur + colormatrix
     threshold). Colors blend additively via mix-blend-mode: screen. This is
     the approach used by Figma covers and Vercel/Linear marketing pages. */
  .aurora-bg {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .aurora-bg svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: saturate(1.0) brightness(0.7);
    mix-blend-mode: screen;
    opacity: 0.55;
  }
  /* Slow rotating conic gradient underneath the blobs — softer now, just for
     ambient color depth so the blobs don't float on flat black. */
  .aurora-bg::before {
    content: '';
    position: absolute;
    inset: -20%;
    background: conic-gradient(
      from var(--angle) at 50% 50%,
      rgba(212,168,102,0.18),
      rgba(138,123,216,0.22),
      rgba(111,207,199,0.16),
      rgba(212,168,102,0.18)
    );
    filter: blur(140px) saturate(1.2);
    animation: auroraSpin 60s linear infinite;
    will-change: --angle;
  }
  /* Force every direct child of body that is NOT the aurora to sit above it.
     header / .tabs / main / .toast all default to position: static (auto z),
     which would render BELOW our z:0 aurora — push them to z:1 explicitly. */
  body > header, body > .tabs, body > main, body > .toast { position: relative; z-index: 1; }

  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes auroraSpin {
    to { --angle: 360deg; }
  }

  /* Respect users who disable motion */
  @media (prefers-reduced-motion: reduce) {
    .aurora-bg svg circle animate { display: none; }
    .aurora-bg::before { animation: none; }
  }

  /* Custom scrollbar — dark theme */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); background-clip: padding-box; border: 2px solid transparent; }

  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 24px;
    background: linear-gradient(180deg, rgba(255,255,255,0.018), transparent);
  }
  header h1 { font: 600 18px/1 var(--serif); letter-spacing: 0.02em; margin: 0; }
  header .subtitle { color: var(--dim); font-size: 12px; font-style: italic; }
  .health { margin-left: auto; display: flex; gap: 10px; font: 12px var(--mono); }
  .health .pill {
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    letter-spacing: 0.02em;
    transition: var(--transition);
  }
  .health .pill.ok { color: var(--ok); border-color: rgba(111,207,151,0.4); background: rgba(111,207,151,0.06); }
  .health .pill.bad { color: var(--err); border-color: rgba(213,120,120,0.4); background: rgba(213,120,120,0.06); }
  .health .pill.idle { color: #d4a866; border-color: rgba(212,168,102,0.4); background: rgba(212,168,102,0.06); }
  .health .pill-action {
    margin-left: 6px;
    font: 11px var(--mono);
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
    transition: var(--transition);
  }
  .health .pill-action:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
  .health .pill-action:disabled { opacity: 0.4; cursor: not-allowed; }

  .tabs {
    display: flex;
    gap: 0;
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    align-items: stretch;
    overflow-x: auto;
  }
  .tab {
    padding: 13px 18px;
    cursor: pointer;
    color: var(--dim);
    border-bottom: 2px solid transparent;
    user-select: none;
    transition: var(--transition);
    white-space: nowrap;
    font: 500 13px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.02); }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--gold);
    background: linear-gradient(180deg, rgba(212,168,102,0.085), transparent 80%);
  }

  main { padding: 28px 28px 96px; max-width: 1200px; margin: 0 auto; }

  .reel-meta { display: flex; gap: 24px; align-items: baseline; margin-bottom: 18px; flex-wrap: wrap; }
  .reel-meta h2 { font: 500 22px/1.2 var(--serif); margin: 0; letter-spacing: -0.01em; }
  .reel-meta .est { color: var(--dim); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
  .title-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: var(--gold-soft);
    border: 1px solid rgba(212,168,102,0.3);
    border-radius: 8px;
    font: 500 16px/1.3 var(--serif);
    color: var(--gold);
    cursor: text;
    transition: var(--transition);
    max-width: 600px;
  }
  .title-badge:hover { background: rgba(212,168,102,0.14); border-color: var(--gold); }
  .title-badge:focus { outline: none; background: var(--panel-2); border-color: var(--gold); color: var(--text); cursor: text; box-shadow: 0 0 0 3px rgba(212,168,102,0.1); }
  .title-badge::after { content: '✎'; font-size: 11px; color: var(--dim); margin-left: 4px; }
  .title-badge:focus::after { content: ''; }
  .target-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 11px var(--mono);
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .target-badge input { width: 36px; background: transparent; border: none; color: var(--gold); font: 11px var(--mono); padding: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .target-badge input:focus { outline: none; }

  .row { display: grid; gap: 16px; }
  .panel {
    background: linear-gradient(180deg, var(--panel-elev), var(--panel) 60%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow-sm), var(--inset-hi);
  }
  .panel h3 {
    margin: 0 0 14px;
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }

  textarea, input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    resize: vertical;
    transition: var(--transition);
  }
  textarea:focus, input[type="text"]:focus, input[type="number"]:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,168,102,0.09);
  }
  textarea::placeholder, input::placeholder { color: var(--dim); opacity: 0.7; }
  textarea.script-area { min-height: 92px; }
  textarea.prompt-area { min-height: 84px; font: 13px/1.5 var(--mono); }
  textarea.motion-prompt-area { background: var(--purple-soft); border-color: rgba(138,123,216,0.25); }
  textarea.motion-prompt-area:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(138,123,216,0.12); }

  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    cursor: pointer;
    font: 600 13px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    transition: var(--transition);
  }
  button:hover {
    border-color: rgba(212,168,102,0.5);
    color: var(--gold);
    background: rgba(212,168,102,0.04);
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.4); }
  button:disabled:hover { border-color: var(--line); color: var(--text); background: var(--panel-2); transform: none; }
  button.primary {
    background: linear-gradient(180deg, #e0b676, var(--gold));
    color: #1a1408;
    border-color: var(--gold);
    box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 2px 8px rgba(212,168,102,0.18);
  }
  button.primary:hover {
    background: linear-gradient(180deg, #ecc285, #d4a866);
    color: #1a1408;
    border-color: var(--gold);
    box-shadow: 0 1px 0 rgba(255,255,255,0.22) inset, 0 4px 14px rgba(212,168,102,0.28);
  }

  .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .actions audio { margin-left: auto; max-width: 280px; }
  .duration { font: 12px var(--mono); color: var(--dim); margin-left: 12px; font-variant-numeric: tabular-nums; }
  .duration.bad { color: var(--err); }
  .duration.ok { color: var(--ok); }

  .shots { display: grid; gap: 12px; margin-top: 4px; }
  .shot {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 200px;
    gap: 16px;
    transition: var(--transition);
    box-shadow: var(--inset-hi);
  }
  .shot:hover { border-color: rgba(212,168,102,0.22); }
  .shot .col-info { display: grid; gap: 10px; }
  .shot .col-thumb { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .shot .voice-line { font: italic 13px var(--serif); color: var(--text); }
  .shot .silence { color: var(--dim); font-style: italic; }
  .shot .meta { font: 11px var(--mono); color: var(--dim); display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
  .shot .caption-row { display: flex; gap: 10px; align-items: center; font-size: 12px; }
  .shot .caption-row span { color: var(--dim); flex-shrink: 0; }
  .shot .thumb {
    width: 100%;
    aspect-ratio: 9/16;
    background: #0c0c12;
    border: 1px dashed var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font: 12px var(--mono);
    transition: var(--transition);
  }
  .shot .thumb img { width: 100%; height: 100%; object-fit: cover; }

  .storyboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
  .storyboard .frame {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    aspect-ratio: 9/16;
    overflow: hidden;
    position: relative;
    transition: var(--transition);
  }
  .storyboard .frame:hover { border-color: rgba(212,168,102,0.3); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .storyboard .frame img { width: 100%; height: 100%; object-fit: cover; }
  .storyboard .frame .label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.85)); color: white; font: 11px var(--mono); padding: 14px 6px 6px; text-align: center; font-variant-numeric: tabular-nums; }
  .storyboard .frame .empty { display: flex; align-items: center; justify-content: center; color: var(--dim); font: 11px var(--mono); height: 100%; }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(20,20,28,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 18px;
    font: 13px var(--mono);
    max-width: 380px;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.22s cubic-bezier(0.2, 0.6, 0.2, 1);
  }
  .toast.ok { border-color: var(--ok); }
  .toast.err { border-color: var(--err); color: #ffb6b6; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* System tab styling */
  .system-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .system-grid .panel { margin: 0; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 16px; font: 12px var(--mono); }
  .kv .k { color: var(--dim); }
  .kv .v { color: var(--text); word-break: break-all; font-variant-numeric: tabular-nums; }
  .kv .v.ok { color: var(--ok); }
  .kv .v.bad { color: var(--err); }

  .ckpt-list { display: grid; gap: 4px; max-height: 220px; overflow-y: auto; padding: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); font: 12px var(--mono); }
  .ckpt-row { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; transition: var(--transition); }
  .ckpt-row:hover { background: var(--gold-soft); }
  .ckpt-row.flux { color: var(--purple); }
  .ckpt-row.current { background: rgba(212,168,102,0.16); color: var(--gold); }
  .ckpt-row .badge { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: rgba(138,123,216,0.16); color: var(--purple); }
  .ckpt-row .use-btn { margin-left: auto; font-size: 10px; padding: 2px 8px; }

  .workflow-preview { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; font: 11px var(--mono); white-space: pre-wrap; max-height: 240px; overflow: auto; color: var(--dim); }

  /* Pipeline status visual */
  .pipeline-status {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 18px;
    background: linear-gradient(180deg, var(--panel-elev), var(--panel-2) 60%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 18px;
    flex-wrap: wrap;
    box-shadow: var(--inset-hi);
  }
  .pipeline-step {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font: 11px var(--mono);
    border: 1px solid var(--line);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    transition: var(--transition);
  }
  .pipeline-step.done { color: var(--ok); border-color: rgba(111,207,151,0.4); background: rgba(111,207,151,0.06); }
  .pipeline-step.partial { color: var(--warn); border-color: rgba(224,182,116,0.4); background: rgba(224,182,116,0.05); }
  .pipeline-step.todo { color: var(--dim); }
  .pipeline-arrow { color: var(--line); font-size: 16px; opacity: 0.7; }

  /* Editable voice line */
  textarea.voice-edit { min-height: 60px; font: italic 13px/1.5 var(--serif); background: var(--gold-soft); border-color: rgba(212,168,102,0.2); }
  textarea.voice-edit:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,168,102,0.09); }
  .voice-edit-row { display: flex; align-items: flex-end; gap: 8px; }
  .voice-edit-row textarea { flex: 1; }

  /* Caption preview overlay on thumbnails */
  .thumb { position: relative; }
  .thumb .caption-overlay { position: absolute; bottom: 8px; left: 6px; right: 6px; color: white; font: 600 10px/1.2 -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.95); pointer-events: none; padding: 4px; background: linear-gradient(transparent, rgba(0,0,0,0.55)); }
  .thumb .silence-marker { position: absolute; top: 4px; right: 6px; color: var(--dim); font: 9px var(--mono); }

  /* Photos tab */
  .photos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .photo-tile {
    position: relative;
    aspect-ratio: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
    cursor: pointer;
    transition: var(--transition);
  }
  .photo-tile:hover { transform: scale(1.04); border-color: var(--gold); box-shadow: var(--shadow-md); }
  .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-tile .name { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.85)); color: white; font: 10px var(--mono); padding: 12px 4px 4px; text-align: center; opacity: 0; transition: var(--transition); }
  .photo-tile:hover .name { opacity: 1; }

  .photo-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 32px; }
  .photo-modal.open { display: flex; }
  .photo-modal img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: var(--shadow-lg); border-radius: var(--radius-sm); }
  .photo-modal .close { position: absolute; top: 16px; right: 16px; font-size: 28px; color: white; cursor: pointer; background: none; border: none; opacity: 0.7; transition: var(--transition); }
  .photo-modal .close:hover { opacity: 1; }

  /* Preset library rows (added by renderPresets in JS) */
  .preset-row { transition: var(--transition); }
  .preset-row:hover { border-color: rgba(138,123,216,0.4) !important; box-shadow: var(--shadow-sm); }

  /* ── Overlays panel ─────────────────────────────────── */
  .overlay-upload {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px; margin-bottom: 14px;
    background: var(--gold-soft); border: 1px dashed rgba(212,168,102,0.35);
    border-radius: var(--radius-sm);
  }
  .overlay-upload input[type="text"] { flex: 1; min-width: 140px; }
  .overlay-upload-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; cursor: pointer;
    background: var(--gold); color: #1a1408;
    border-radius: var(--radius-sm); font: 600 12px var(--mono);
  }
  .overlay-upload-btn:hover { background: #e5be7d; }
  .overlay-upload-status { font: 11px var(--mono); color: var(--dim); }
  .overlay-row {
    display: grid; grid-template-columns: 60px 1fr auto; gap: 10px;
    align-items: start; padding: 10px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); margin-bottom: 10px;
    transition: var(--transition);
  }
  .overlay-row:hover { border-color: rgba(212,168,102,0.4); box-shadow: var(--shadow-sm); }
  .overlay-thumb {
    width: 60px; height: 60px; object-fit: contain;
    background: repeating-conic-gradient(#1a1a23 0% 25%, #14141d 0% 50%) 50% / 12px 12px;
    border-radius: 4px; padding: 4px; box-sizing: border-box;
  }
  .overlay-controls { display: grid; gap: 6px; min-width: 0; }
  .overlay-controls input[type="text"], .overlay-controls input[type="number"], .overlay-controls select {
    padding: 5px 7px; font: 11px var(--mono); border-radius: 4px;
  }
  .overlay-controls .overlay-times { display: flex; gap: 6px; align-items: center; color: var(--dim); font: 11px var(--mono); }
  .overlay-controls .overlay-times input { width: 64px; }
  .overlay-controls .overlay-row-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; align-items: center;
    color: var(--dim); font: 11px var(--mono);
  }

<header>

  <span class="subtitle">v1 piloto · Higgs voice + ComfyUI images</span>

<div class="tabs" id="tabs"></div>

<main id="main"></main>

<div class="toast" id="toast" style="display:none"></div>

<script>
const state = {
  reels: [],
  active: null,
  system: null,
  presets: [],
};

const SYSTEM_TAB = '__system__';
const PHOTOS_TAB = '__photos__';

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = await res.text();
    try { msg = JSON.parse(msg).error || msg; } catch (_) {}
    throw new Error(msg || `HTTP ${res.status}`);
  }
  return res.json();
}

function toast(msg, kind = 'ok', ms = 4000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + kind;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = 'none'; }, ms);
}

async function refreshHealth() {
  try {
    const h = await api('/api/health');
    const ph = document.getElementById('pill-higgs');
    const pv = document.getElementById('pill-voicebox');
    const pc = document.getElementById('pill-comfy');
    const btn = document.getElementById('btn-higgs-toggle');
    if (!h.higgs.ok) {
      ph.textContent = 'Higgs ✗';
      ph.className = 'pill bad';
      ph.title = h.higgs.error || 'down';
      btn.style.display = 'none';
    } else if (h.higgs.loaded === false) {
      ph.textContent = 'Higgs ⏸ idle';
      ph.className = 'pill idle';
      ph.title = 'Model unloaded — VRAM freed for ComfyUI. Click reload before generating audio.';
      btn.style.display = '';
      btn.textContent = 'reload';
      btn.dataset.action = 'reload';
      btn.disabled = false;
    } else {
      const vram = (h.higgs.vram_gb != null) ? ` · ${h.higgs.vram_gb} GB` : '';
      ph.textContent = `Higgs ✓${vram}`;
      ph.className = 'pill ok';
      ph.title = 'Loaded and ready.';
      btn.style.display = '';
      btn.textContent = 'unload';
      btn.dataset.action = 'unload';
      btn.disabled = false;
    }
    pv.textContent = h.voicebox?.ok ? 'Voicebox ✓' : 'Voicebox ✗';
    pv.className = 'pill ' + (h.voicebox?.ok ? 'ok' : 'bad');
    pc.textContent = h.comfyui.ok ? 'ComfyUI ✓' : 'ComfyUI ✗';
    pc.className = 'pill ' + (h.comfyui.ok ? 'ok' : 'bad');
  } catch (e) { /* ignore */ }
}

async function loadAll() {
  const data = await api('/api/specs');
  state.reels = data.reels;
  try {
    const p = await api('/api/presets');
    state.presets = p.presets || [];
  } catch (_) { state.presets = []; }
  if (!state.active) state.active = SYSTEM_TAB;
  renderTabs();
  renderActive();
}

async function loadSystem() {
  try {
    state.system = await api('/api/system');
  } catch (e) {
    state.system = { error: e.message };
  }
  if (state.active === SYSTEM_TAB) renderActive();
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';

  const sysTab = document.createElement('div');
  sysTab.className = 'tab' + (state.active === SYSTEM_TAB ? ' active' : '');
  sysTab.innerHTML = '⚙ System';
  sysTab.onclick = () => { state.active = SYSTEM_TAB; renderTabs(); renderActive(); loadSystem(); };
  tabs.appendChild(sysTab);

  for (const r of state.reels) {
    const el = document.createElement('div');
    const isActive = r.reel_id === state.active;
    el.className = 'tab' + (isActive ? ' active' : '');
    el.style.display = 'inline-flex';
    el.style.alignItems = 'center';
    el.style.gap = '6px';
    const titleSpan = document.createElement('span');
    titleSpan.textContent = r.title || r.reel_id;
    titleSpan.style.cursor = 'pointer';
    titleSpan.onclick = () => { state.active = r.reel_id; renderTabs(); renderActive(); };
    el.appendChild(titleSpan);
    if (isActive) {
      const closeBtn = document.createElement('span');
      closeBtn.textContent = '×';
      closeBtn.title = 'Delete this reel (removes ALL assets)';
      closeBtn.style.cssText = 'cursor:pointer;color:var(--err);font-size:18px;line-height:1;padding:0 4px;border-radius:3px;opacity:0.65';
      closeBtn.onmouseover = () => { closeBtn.style.opacity = '1'; closeBtn.style.background = 'rgba(229,90,90,0.15)'; };
      closeBtn.onmouseout = () => { closeBtn.style.opacity = '0.65'; closeBtn.style.background = 'transparent'; };
      closeBtn.onclick = (ev) => { ev.stopPropagation(); deleteReel(r.reel_id, r.title); };
      el.appendChild(closeBtn);
    }
    tabs.appendChild(el);
  }

  const photosTab = document.createElement('div');
  photosTab.className = 'tab' + (state.active === PHOTOS_TAB ? ' active' : '');
  photosTab.innerHTML = '📷 Client photos';
  photosTab.onclick = () => { state.active = PHOTOS_TAB; renderTabs(); renderActive(); };
  tabs.appendChild(photosTab);

  const newReelTab = document.createElement('div');
  newReelTab.className = 'tab';
  newReelTab.innerHTML = '＋';
  newReelTab.title = 'Create a new reel';
  newReelTab.style.cssText = 'color:var(--purple);font-weight:600;font-size:18px;line-height:1;padding:0 14px';
  newReelTab.onclick = createReel;
  tabs.appendChild(newReelTab);
}

async function createReel() {
  const title = prompt('New reel title (e.g. "Unity in Diversity"):', '');
  if (!title || !title.trim()) return;
  const slug = prompt('Reel id slug (lowercase_with_underscores, used as folder name):', title.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''));
  if (!slug || !slug.trim()) return;
  try {
    const out = await api('/api/reel/new', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reel_id: slug.trim(), title: title.trim() }),
    });
    toast(`Reel "${out.spec.title}" created (id: ${out.reel_id}).`);
    state.active = out.reel_id;
    await loadAll();
  } catch (e) {
    toast('Create reel failed: ' + e.message, 'err', 8000);
  }
}

async function refreshShotsOnly(reelId) {
  try {
    const fresh = await api(`/api/spec/${reelId}`);
    const idx = state.reels.findIndex(x => x.reel_id === reelId);
    if (idx >= 0) state.reels[idx] = fresh;
    if (state.active === reelId) renderShots(fresh);
  } catch (_) { /* ignore — visual refresh only */ }
}

async function runBatch(ev, r, kind) {
  const labels = { voice: 'Voice', image: 'Image', animate: 'Motion' };
  const finalLabels = { voice: '🎙 Gen all voices', image: '🖼 Gen all images', animate: '🎞 Animate all' };
  const lockIds = ['btn-batch-voice', 'btn-batch-image', 'btn-batch-animate'];
  const lockNow = (state) => lockIds.forEach(id => { const el = document.getElementById(id); if (el) el.disabled = state; });
  const setBtnText = (txt) => { const el = document.getElementById(`btn-batch-${kind}`); if (el) el.innerHTML = txt; };
  const setStatus = (txt) => { const el = document.getElementById('batch-status'); if (el) el.textContent = txt; };
  lockNow(true);

  // Refresh from server so we have current asset state
  let fresh;
  try { fresh = await api(`/api/spec/${r.reel_id}`); }
  catch (e) { fresh = r; }
  const shots = fresh.shots || [];

  const targets = shots.filter(s => {
    if (kind === 'voice') {
      const isSilence = (s.voice_line || '').trim().startsWith('(') && (s.voice_line || '').trim().endsWith(')');
      if (isSilence) return false;
      if (!(s.voice_line || '').trim()) return false;
      return !s.voice_exists;
    }
    if (kind === 'image') {
      if (!(s.image_prompt || '').trim()) return false;
      return !s.image_exists;
    }
    if (kind === 'animate') return s.image_exists && !s.motion_exists;
    return false;
  });

  const skipped = shots.length - targets.length;
  if (targets.length === 0) {
    toast(`Nothing to do — ${skipped} shot(s) already done or skipped.`);
    lockNow(false);
    return;
  }
  toast(`${labels[kind]}: queuing ${targets.length} shot(s) (${skipped} skipped).`);

  let done = 0, failed = 0;
  for (const s of targets) {
    setStatus(`${labels[kind]} ${done + 1}/${targets.length} → shot ${s.id}…`);
    setBtnText(`<span class="spinner"></span>${done + 1}/${targets.length}`);
    try {
      let url;
      if (kind === 'voice') url = `/api/voice/${r.reel_id}/${s.id}`;
      else if (kind === 'image') url = `/api/image/${r.reel_id}/${s.id}`;
      else url = `/api/animate/${r.reel_id}/${s.id}`;
      await api(url, { method: 'POST' });
      done++;
      // Refresh ONLY shot cards so the just-generated audio/image/motion appears
      // immediately in the UI before we kick off the next shot.
      await refreshShotsOnly(r.reel_id);
      // Re-lock buttons after re-render (renderShots doesn't touch batch buttons,
      // but defensive — and renderShots may have re-bound shot-level handlers).
      lockNow(true);
    } catch (e) {
      failed++;
      toast(`shot ${s.id} ${kind} failed: ${e.message}`, 'err', 5000);
    }
  }

  setStatus(`${labels[kind]}: ${done} done, ${failed} failed, ${skipped} skipped.`);
  toast(`${labels[kind]} batch complete: ${done}/${targets.length} (${failed} failed, ${skipped} skipped).`);
  setBtnText(finalLabels[kind]);
  lockNow(false);
  await loadAll();
}

async function deleteReel(reelId, reelTitle) {
  const confirmation = prompt(`DELETE reel "${reelTitle || reelId}" and ALL its assets (images, voices, motion clips, render).\n\nType the reel id "${reelId}" to confirm:`);
  if (confirmation !== reelId) {
    if (confirmation !== null) toast('Reel id did not match — delete cancelled.', 'err');
    return;
  }
  try {
    const out = await api(`/api/reel/${reelId}/delete`, { method: 'POST' });
    toast(`Reel "${reelId}" deleted (${out.files_removed} files removed).`);
    state.active = SYSTEM_TAB;
    await loadAll();
  } catch (e) {
    toast('Delete reel failed: ' + e.message, 'err', 8000);
  }
}

function fmtSec(n) { if (n == null) return '—'; const s = (+n).toFixed(1); return `${s}s`; }

            <input type="number" step="0.5" min="1.4" max="16.7" id="preset-length" placeholder="8.4" style="width:80px;font:12px var(--mono);background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:6px 8px" title="length in seconds">
          </div>
          <input type="text" id="preset-description" placeholder="short description (optional)" style="width:100%;font:12px var(--mono);background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin-bottom:6px">
          <textarea id="preset-prompt" placeholder="motion prompt for Wan 2.1…" style="width:100%;min-height:70px;font:12px/1.5 var(--mono);background:rgba(138,123,216,0.04);color:var(--text);border:1px solid rgba(138,123,216,0.25);border-radius:4px;padding:8px;box-sizing:border-box"></textarea>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="primary" id="btn-preset-save">Save preset</button>
            <button id="btn-preset-cancel">Cancel</button>
          </div>
        </div>
      </div>

    </div>
  `;

  // Batch generators — sequential queue (Comfy/Higgs are single-GPU, parallel won't help).
  // Skip-if-exists by default. Re-roll/re-gen individual shots manually after if needed.
  document.getElementById('btn-batch-voice').onclick = (ev) => runBatch(ev, r, 'voice');
  document.getElementById('btn-batch-image').onclick = (ev) => runBatch(ev, r, 'image');
  document.getElementById('btn-batch-animate').onclick = (ev) => runBatch(ev, r, 'animate');

  // ── Pipeline-level Compose & render: voice compose + ffmpeg render in one call
  const btnBuild = document.getElementById('btn-build');
  const linkPreview = document.getElementById('link-preview');
  if (btnBuild && !btnBuild.disabled) {
    btnBuild.onclick = async (ev) => {
      const btn = ev.currentTarget;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Composing voice + rendering…';
      const status = document.getElementById('build-status');
      status.textContent = 'voice → ffmpeg → ASS subs → mp4 (this can take 60-120s)';
      try {
        const out = await api(`/api/build/${r.reel_id}`, { method: 'POST' });
        toast(`Done: voice ${fmtSec(out.voice_duration_sec)} · render ${out.size_mb} MB`);
        // activate Open preview
        if (linkPreview) {
          linkPreview.href = `/preview.html?reel=${r.reel_id}`;
          linkPreview.classList.remove('todo');
          linkPreview.classList.add('done');
          linkPreview.style.cssText = 'text-decoration:none;font-weight:700;background:var(--teal);color:#0b0b0f;border-color:var(--teal)';
        }
        btn.innerHTML = '🎬 Re-render';
        btn.disabled = false;
        status.innerHTML = `✓ render.mp4 ready · ${out.size_mb} MB · click <b>▶ Open preview</b> to view + download`;
        await loadAll();
      } catch (e) {
        toast('Compose & render failed: ' + e.message, 'err', 12000);
        btn.disabled = false;
        btn.innerHTML = '🎬 Compose &amp; render';
        status.textContent = 'failed';
      }
    };
  }

  // render + download moved to /preview.html?reel=<reel_id> (opens in new tab)

  // Editable title badge — saves on blur or Enter
  const titleEl = document.getElementById('reel-title');
  if (titleEl) {
    titleEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
      if (e.key === 'Escape') { titleEl.textContent = r.title || r.reel_id; titleEl.blur(); }
    });
    titleEl.addEventListener('blur', async () => {
      const newTitle = titleEl.textContent.trim();
      if (newTitle && newTitle !== r.title) {
        r.title = newTitle;
        try {
          await api(`/api/spec/${r.reel_id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(r) });
          toast(`Title saved`);
          state.reels = state.reels.map(x => x.reel_id === r.reel_id ? r : x);
          renderTabs();
        } catch (e) { toast('Save failed: ' + e.message, 'err'); }
      }
    });
  }

  const subsEl = document.getElementById('reel-subtitles');
  if (subsEl) {
    subsEl.addEventListener('change', async () => {
      const v = subsEl.value;
      if (v === r.subtitles) return;
      r.subtitles = v;
      try {
        await api(`/api/spec/${r.reel_id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(r) });
        toast(`Subtitles mode: ${v}`);
        state.reels = state.reels.map(x => x.reel_id === r.reel_id ? r : x);
      } catch (e) { toast('Save failed: ' + e.message, 'err'); }
    });
  }

  const targetEl = document.getElementById('reel-target');
  if (targetEl) {
    targetEl.addEventListener('change', async () => {
      const v = parseInt(targetEl.value, 10);
      if (v >= 10 && v <= 90 && v !== r.duration_target_sec) {
        r.duration_target_sec = v;
        try {
          await api(`/api/spec/${r.reel_id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(r) });
          toast(`Target ${v}s saved`);
          state.reels = state.reels.map(x => x.reel_id === r.reel_id ? r : x);
        } catch (e) { toast('Save failed: ' + e.message, 'err'); }
      }
    });
  }

  renderShots(r);
  renderStoryboard(r);
  renderPresets();
  renderOverlays(r);
}

const OVERLAY_POSITIONS = [
  'top-left', 'top-center', 'top-right',
  'center-left', 'center', 'center-right',
  'bottom-left', 'bottom-center', 'bottom-right',
  'custom',
];

function renderOverlays(r) {
  const list = document.getElementById('overlays-list');
  if (!list) return;
  const overlays = r.overlays || [];

  if (overlays.length === 0) {
    list.innerHTML = '<div class="overlays-empty">No overlays. Upload a PNG/SVG above to add a logo, seal or watermark.</div>';
  } else {
    list.innerHTML = overlays.map(ov => `
      <div class="overlay-row" data-id="${ov.id}">
        <img class="overlay-thumb" src="${ov.url || ''}?v=${Date.now()}" alt="${escapeHtml(ov.label || ov.filename)}">
        <div class="overlay-controls">
          <input type="text" class="overlay-label" value="${escapeHtml(ov.label || ov.filename)}" placeholder="label" title="Display label (does not affect render)">
          <div class="overlay-times">
            <span title="Visible from second (video timeline)">in</span>
            <input type="number" class="overlay-start" value="${ov.start_sec}" step="0.1" min="0">
            <span>→</span>
            <input type="number" class="overlay-end" value="${ov.end_sec}" step="0.1" min="0" title="Visible until second">
            <span>s</span>
          </div>
          <div class="overlay-row-grid">
            <label>position
              <select class="overlay-position">
                ${OVERLAY_POSITIONS.map(p => `<option value="${p}" ${ov.position === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </label>
            <label>scale
              <input type="range" class="overlay-scale" min="5" max="100" step="1" value="${ov.scale_pct}">
              <span class="v" data-bind="scale">${ov.scale_pct}%</span>
            </label>
            <label>fade in
              <input type="range" class="overlay-fade-in" min="0" max="2" step="0.05" value="${ov.fade_in_sec}">
              <span class="v" data-bind="fade-in">${ov.fade_in_sec.toFixed(2)}s</span>
            </label>
            <label>fade out
              <input type="range" class="overlay-fade-out" min="0" max="2" step="0.05" value="${ov.fade_out_sec}">
              <span class="v" data-bind="fade-out">${ov.fade_out_sec.toFixed(2)}s</span>
            </label>
            <label>opacity
              <input type="range" class="overlay-opacity" min="0" max="1" step="0.05" value="${ov.opacity}">
              <span class="v" data-bind="opacity">${Math.round(ov.opacity * 100)}%</span>
            </label>
            <label class="overlay-custom-xy" style="${ov.position === 'custom' ? '' : 'display:none'}">x %
              <input type="range" class="overlay-x" min="0" max="100" step="1" value="${ov.x_pct}">
              <span class="v" data-bind="x">${ov.x_pct}%</span>
            </label>
            <label class="overlay-custom-xy" style="${ov.position === 'custom' ? '' : 'display:none'}">y %
              <input type="range" class="overlay-y" min="0" max="100" step="1" value="${ov.y_pct}">
              <span class="v" data-bind="y">${ov.y_pct}%</span>
            </label>
          </div>
        </div>
        <button class="overlay-delete" title="Delete overlay (file + spec entry)">🗑</button>
      </div>
    `).join('');
    // Wire row controls
    list.querySelectorAll('.overlay-row').forEach(row => bindOverlayRow(r, row));
  }

  // Upload binding (re-bound every render since the form is inside the panel template)
  const fileInput = document.getElementById('overlay-file-input');
  const labelInput = document.getElementById('overlay-upload-label');
  const status = document.getElementById('overlay-upload-status');
  if (fileInput && !fileInput.dataset.bound) {
    fileInput.dataset.bound = '1';
    fileInput.addEventListener('change', async () => {
      const f = fileInput.files[0];
      if (!f) return;
      status.textContent = `uploading ${f.name} (${(f.size/1024).toFixed(1)} KB)…`;
      try {
        const reader = new FileReader();
        const dataUrl = await new Promise((res, rej) => {
          reader.onload = () => res(reader.result);
          reader.onerror = () => rej(reader.error);
          reader.readAsDataURL(f);
        });
        const data_b64 = dataUrl.split(',', 2)[1] || '';
        const out = await api(`/api/overlay/${r.reel_id}/upload`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: f.name, data_b64, label: (labelInput?.value || '').trim() }),
        });
        toast(`Overlay added: ${out.overlay.filename}`);
        status.textContent = `✓ ${out.overlay.filename} · ${(out.size_bytes/1024).toFixed(1)} KB`;
        labelInput.value = '';
        fileInput.value = '';
        // Refresh reel state then re-render only the overlays panel
        await loadAll();
        const fresh = state.reels.find(x => x.reel_id === r.reel_id);
        if (fresh) renderOverlays(fresh);
      } catch (e) {
        status.textContent = `failed: ${e.message}`;
        toast(`Overlay upload failed: ${e.message}`, 'err', 8000);
      }
    });
  }
}

function bindOverlayRow(r, row) {
  const id = row.dataset.id;
  const debounceMap = new WeakMap();

  const debouncedSave = (props) => {
    if (debounceMap.has(row)) clearTimeout(debounceMap.get(row));
    debounceMap.set(row, setTimeout(async () => {
      try {
        const out = await api(`/api/overlay/${r.reel_id}/${id}/update`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(props),
        });
        // Update in-memory state silently (don't re-render — would lose focus)
        const fresh = state.reels.find(x => x.reel_id === r.reel_id);
        if (fresh) {
          const ov = (fresh.overlays || []).find(o => o.id === id);
          if (ov) Object.assign(ov, out.overlay);
        }
      } catch (e) {
        toast(`Overlay save failed: ${e.message}`, 'err');
      }
    }, 350));
  };

  const $ = (sel) => row.querySelector(sel);
  const bind = (sel, prop, parser, suffix = '', bindKey = null) => {
    const el = $(sel);
    if (!el) return;
    el.addEventListener('input', () => {
      const v = parser(el.value);
      if (bindKey) {
        const out = $(`[data-bind="${bindKey}"]`);
        if (out) out.textContent = (typeof v === 'number' && bindKey === 'opacity') ? `${Math.round(v*100)}%`
          : (typeof v === 'number' && (bindKey === 'fade-in' || bindKey === 'fade-out')) ? `${v.toFixed(2)}s`
          : `${v}${suffix}`;
      }
      debouncedSave({ [prop]: v });
    });
  };

  bind('.overlay-label', 'label', v => v);
  bind('.overlay-start', 'start_sec', v => parseFloat(v));
  bind('.overlay-end', 'end_sec', v => parseFloat(v));
  bind('.overlay-scale', 'scale_pct', v => parseInt(v, 10), '%', 'scale');
  bind('.overlay-fade-in', 'fade_in_sec', v => parseFloat(v), 's', 'fade-in');
  bind('.overlay-fade-out', 'fade_out_sec', v => parseFloat(v), 's', 'fade-out');
  bind('.overlay-opacity', 'opacity', v => parseFloat(v), '', 'opacity');
  bind('.overlay-x', 'x_pct', v => parseInt(v, 10), '%', 'x');
  bind('.overlay-y', 'y_pct', v => parseInt(v, 10), '%', 'y');

  const posSel = $('.overlay-position');
  if (posSel) {
    posSel.addEventListener('change', () => {
      const v = posSel.value;
      // Toggle visibility of custom x/y rows
      row.querySelectorAll('.overlay-custom-xy').forEach(el => {
        el.style.display = (v === 'custom') ? '' : 'none';
      });
      debouncedSave({ position: v });
    });
  }

  const delBtn = $('.overlay-delete');
  if (delBtn) {
    delBtn.addEventListener('click', async () => {
      if (!confirm('Delete this overlay? The image file will also be removed.')) return;
      try {
        await api(`/api/overlay/${r.reel_id}/${id}/delete`, { method: 'POST' });
        toast('Overlay deleted');
        await loadAll();
        const fresh = state.reels.find(x => x.reel_id === r.reel_id);
        if (fresh) renderOverlays(fresh);
      } catch (e) {
        toast(`Delete failed: ${e.message}`, 'err');
      }
    });
  }
}

function renderPresets() {
  const list = document.getElementById('presets-list');
  if (!list) return;
  const items = (state.presets || []).map(p => `
    <div class="preset-row" data-preset="${escapeHtml(p.name)}" style="display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;background:var(--panel-2)">
      <div style="flex:1;min-width:0">
        <div style="font:13px var(--mono);color:var(--purple);font-weight:600">${escapeHtml(p.name)}</div>
        <div style="font:11px var(--mono);color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.description || '')}</div>
        <div style="font:10px var(--mono);color:var(--dim);margin-top:4px;line-height:1.4;white-space:pre-wrap">${escapeHtml((p.motion_prompt || '').slice(0, 240))}${(p.motion_prompt || '').length > 240 ? '…' : ''}</div>
      </div>
      <span style="font:11px var(--mono);color:var(--dim);flex-shrink:0">${p.motion_length_sec ?? 8.4}s</span>
      <button data-action="delete-preset" data-preset="${escapeHtml(p.name)}" title="Delete this preset" style="font-size:14px;padding:4px 10px;color:var(--err);border-color:rgba(229,90,90,0.3);background:transparent;flex-shrink:0">🗑</button>
    </div>
  `).join('');
  const empty = (state.presets || []).length === 0
    ? '<div style="color:var(--dim);font:12px var(--mono);padding:8px 4px">No presets yet. Click + to create one.</div>'
    : '';
  list.innerHTML = items + empty + `
    <div style="display:flex;justify-content:center;padding:8px;margin-top:6px">
      <button data-action="new-preset" style="font-size:12px;padding:6px 16px;background:rgba(138,123,216,0.08);border-color:var(--purple);color:var(--purple)">+ New preset</button>
    </div>
  `;
  list.onclick = onPresetsClick;

  // Form save/cancel handlers (idempotent — re-bound each render)
  const form = document.getElementById('presets-form');
  document.getElementById('btn-preset-cancel').onclick = () => { form.style.display = 'none'; };
  document.getElementById('btn-preset-save').onclick = async () => {
    const name = document.getElementById('preset-name').value.trim();
    const length = document.getElementById('preset-length').value.trim();
    const description = document.getElementById('preset-description').value.trim();
    const prompt = document.getElementById('preset-prompt').value.trim();
    if (!name) { toast('Preset name required.', 'err'); return; }
    if (!prompt) { toast('Motion prompt required.', 'err'); return; }
    try {
      const out = await api('/api/presets/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name, motion_prompt: prompt, description,
          motion_length_sec: length ? parseFloat(length) : null,
        }),
      });
      toast(`Preset "${out.preset.name}" saved (${out.total} total).`);
      form.style.display = 'none';
      const fresh = await api('/api/presets');
      state.presets = fresh.presets || [];
      renderPresets();
      // Re-render shots so dropdowns pick up the new preset
      const r = state.reels.find(x => x.reel_id === state.active);
      if (r) renderShots(r);
    } catch (e) { toast('Save failed: ' + e.message, 'err'); }
  };
}

async function onPresetsClick(ev) {
  const btn = ev.target.closest('button');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'new-preset') {
    const form = document.getElementById('presets-form');
    document.getElementById('preset-name').value = '';
    document.getElementById('preset-length').value = '';
    document.getElementById('preset-description').value = '';
    document.getElementById('preset-prompt').value = '';
    form.style.display = 'block';
    document.getElementById('preset-name').focus();
  } else if (action === 'delete-preset') {
    const name = btn.dataset.preset;
    if (!confirm(`Delete preset "${name}"?`)) return;
    try {
      await api('/api/presets/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      toast(`Preset "${name}" deleted.`);
      const fresh = await api('/api/presets');
      state.presets = fresh.presets || [];
      renderPresets();
      const r = state.reels.find(x => x.reel_id === state.active);
      if (r) renderShots(r);
    } catch (e) { toast('Delete failed: ' + e.message, 'err'); }
  }
}

  const wrap = document.getElementById('shots');

        <div class="caption-row" style="font-size:11px;flex-wrap:wrap">

          <span style="color:var(--purple)">length (s)</span>

          <select data-shot="${s.id}" data-field="apply_preset" style="font:11px var(--mono);background:var(--panel-2);color:var(--purple);border:1px solid var(--line);border-radius:4px;padding:4px 6px;max-width:160px" title="Apply a saved motion preset to this shot">

        ${s.image_exists ? `<button data-action="reroll-image" data-shot="${s.id}" title="Generate with a NEW random seed">🎲 Reroll</button>` : ''}
        ${s.image_exists ? `<button data-action="animate" data-shot="${s.id}" title="Wan 2.1 image-to-video (~60-180s on RTX 5080)" style="background:${s.motion_exists ? 'rgba(138,123,216,0.18)' : 'var(--panel-2)'};color:${s.motion_exists ? 'var(--purple)' : 'var(--text)'};border-color:${s.motion_exists ? 'var(--purple)' : 'var(--line)'}">🎞 ${s.motion_exists ? 'Re-animate' : 'Animate'}</button>` : ''}
        <button data-action="save-shot" data-shot="${s.id}">Save text</button>
        ${s.motion_exists ? `<video controls muted playsinline style="max-width:200px;width:100%;border-radius:4px;margin-top:4px" src="/api/motion/${r.reel_id}/${s.id}?t=${Date.now()}"></video>` : ''}
        <div style="display:flex;gap:6px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px">
          <button data-action="duplicate-shot" data-shot="${s.id}" title="Duplicate this shot (clears assets, keeps prompts)" style="font-size:10px;padding:3px 8px;flex:1">📋 dup</button>
          <button data-action="delete-shot" data-shot="${s.id}" title="Delete this shot and its assets" style="font-size:10px;padding:3px 8px;flex:1;color:var(--err);border-color:rgba(229,90,90,0.3)">🗑 del</button>
        </div>
      </div>

  addRow.style.cssText = 'display:flex;justify-content:center;padding:12px;border-top:1px dashed var(--line);margin-top:6px';

  wrap.appendChild(addRow);
  wrap.addEventListener('click', onShotsClick);
  wrap.addEventListener('change', onShotsChange);
}

async function refreshThumb(r, s) {
  const slot = document.getElementById('thumb-' + s.id);
  if (!slot) return;
  const captionHtml = s.caption ? `<div class="caption-overlay">${escapeHtml(s.caption)}</div>` : '';
  try {
    const res = await fetch(`/api/image/${r.reel_id}/${s.id}?t=${Date.now()}`);
    if (!res.ok) {
      slot.innerHTML = `<span style="color:var(--dim);font:11px var(--mono)">no image yet</span>${captionHtml}`;
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    slot.innerHTML = `<img src="${url}" alt="shot ${s.id}">${captionHtml}`;
  } catch (_) {
    slot.innerHTML = `<span style="color:var(--dim);font:11px var(--mono)">no image yet</span>${captionHtml}`;
  }
}

async function onShotsClick(ev) {
  const btn = ev.target.closest('button');
  if (!btn) return;
  const r = state.reels.find(x => x.reel_id === state.active);
  const shotId = +btn.dataset.shot;
  const action = btn.dataset.action;
  if (action === 'gen-image') {
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Generating…';
    try {
      await saveShotEdits(r, shotId, /*silent*/ true);
      const out = await api(`/api/image/${r.reel_id}/${shotId}`, { method: 'POST' });
      toast(`Image ready (seed ${out.seed})`);
      await loadAll();
    } catch (e) {
      toast('Image gen failed: ' + e.message, 'err', 8000);
      btn.disabled = false; btn.textContent = 'Generate image';
    }
  } else if (action === 'gen-voice') {
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Higgs…';
    try {
      await saveShotEdits(r, shotId, /*silent*/ true);
      const out = await api(`/api/voice/${r.reel_id}/${shotId}`, { method: 'POST' });
      toast(`Shot ${shotId} voice: ${fmtSec(out.duration_sec)}`);
      await loadAll();
    } catch (e) {
      toast('Voice gen failed: ' + e.message, 'err', 8000);
      btn.disabled = false; btn.textContent = 'Gen voice';
    }
  } else if (action === 'reroll-image') {
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>FLUX 🎲…';
    try {
      await saveShotEdits(r, shotId, /*silent*/ true);
      const out = await api(`/api/image/${r.reel_id}/${shotId}/reroll`, { method: 'POST' });
      toast(`Re-rolled with seed ${out.seed}`);
      await loadAll();
    } catch (e) {
      toast('Reroll failed: ' + e.message, 'err', 8000);
      btn.disabled = false; btn.textContent = '🎲 Reroll';
    }
  } else if (action === 'animate') {
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Wan 2.1…';
    try {
      await saveShotEdits(r, shotId, /*silent*/ true);
      const out = await api(`/api/animate/${r.reel_id}/${shotId}`, { method: 'POST' });
      toast(`Shot ${shotId} animated · ${out.size_mb} MB${out.duration_sec ? ' · ' + out.duration_sec.toFixed(1) + 's' : ''}`);
      await loadAll();
    } catch (e) {
      toast('Animate failed: ' + e.message, 'err', 12000);
      btn.disabled = false; btn.textContent = '🎞 Animate';
    }
  } else if (action === 'save-shot') {
    try {
      await saveShotEdits(r, shotId);
      toast('Saved.');
    } catch (e) {
      toast('Save failed: ' + e.message, 'err');
    }
  } else if (action === 'add-shot') {
    btn.disabled = true;
    try {
      const out = await api(`/api/shot/${r.reel_id}/add`, { method: 'POST' });
      toast(`Shot ${out.shot_id} added — fill voice + image prompt and generate.`);
      await loadAll();
    } catch (e) {
      toast('Add shot failed: ' + e.message, 'err');
      btn.disabled = false;
    }
  } else if (action === 'duplicate-shot') {
    btn.disabled = true;
    try {
      await saveShotEdits(r, shotId, /*silent*/ true);
      const out = await api(`/api/shot/${r.reel_id}/${shotId}/duplicate`, { method: 'POST' });
      toast(`Shot ${shotId} duplicated → new shot ${out.shot_id} (regenerate assets).`);
      await loadAll();
    } catch (e) {
      toast('Duplicate failed: ' + e.message, 'err');
      btn.disabled = false;
    }
  } else if (action === 'delete-shot') {
    if (!confirm(`Delete shot ${shotId}? Its image, voice and motion files will be removed.`)) return;
    btn.disabled = true;
    try {
      const out = await api(`/api/shot/${r.reel_id}/${shotId}/delete`, { method: 'POST' });
      toast(`Shot ${shotId} deleted (${out.deleted_files.length} files removed).`);
      await loadAll();
    } catch (e) {
      toast('Delete failed: ' + e.message, 'err');
      btn.disabled = false;
    }
  }
}

async function onShotsChange(ev) {
  const sel = ev.target.closest('select[data-field="apply_preset"]');
  if (!sel) return;
  const presetName = sel.value;
  if (!presetName) return;
  const shotId = +sel.dataset.shot;
  const r = state.reels.find(x => x.reel_id === state.active);
  const preset = state.presets.find(p => p.name === presetName);
  if (!preset) { sel.value = ''; return; }
  const promptEl = document.querySelector(`textarea[data-shot="${shotId}"][data-field="motion_prompt"]`);
  const lenEl = document.querySelector(`input[data-shot="${shotId}"][data-field="motion_length_sec"]`);
  if (promptEl) promptEl.value = preset.motion_prompt || '';
  if (lenEl) lenEl.value = preset.motion_length_sec ?? '';
  try {
    await saveShotEdits(r, shotId, /*silent*/ true);
    toast(`Preset "${presetName}" applied to shot ${shotId}.`);
  } catch (e) {
    toast('Apply preset save failed: ' + e.message, 'err');
  }
  sel.value = '';
}

async function saveShotEdits(r, shotId, silent = false) {
  const promptEl = document.querySelector(`textarea[data-shot="${shotId}"][data-field="image_prompt"]`);
  const captionEl = document.querySelector(`input[data-shot="${shotId}"][data-field="caption"]`);
  const voiceEl = document.querySelector(`textarea[data-shot="${shotId}"][data-field="voice_line"]`);
  const pauseEl = document.querySelector(`input[data-shot="${shotId}"][data-field="pause_after_sec"]`);
  const seedEl = document.querySelector(`input[data-shot="${shotId}"][data-field="image_seed"]`);
  const voiceSeedEl = document.querySelector(`input[data-shot="${shotId}"][data-field="voice_seed"]`);
  const motionPromptEl = document.querySelector(`textarea[data-shot="${shotId}"][data-field="motion_prompt"]`);
  const motionSeedEl = document.querySelector(`input[data-shot="${shotId}"][data-field="motion_seed"]`);
  const shot = r.shots.find(x => x.id === shotId);
  if (promptEl) shot.image_prompt = promptEl.value;
  if (captionEl) shot.caption = captionEl.value;
  if (voiceEl) shot.voice_line = voiceEl.value;
  if (pauseEl) shot.pause_after_sec = parseFloat(pauseEl.value) || 0;
  if (seedEl) {
    const v = seedEl.value.trim();
    shot.image_seed = v === '' ? null : (parseInt(v, 10) || null);
  }
  if (voiceSeedEl) {
    const v = voiceSeedEl.value.trim();
    shot.voice_seed = v === '' ? null : (parseInt(v, 10) || null);
  }
  if (motionPromptEl) {
    const v = motionPromptEl.value.trim();
    shot.motion_prompt = v === '' ? null : v;
  }
  if (motionSeedEl) {
    const v = motionSeedEl.value.trim();
    shot.motion_seed = v === '' ? null : (parseInt(v, 10) || null);
  }
  const motionLenEl = document.querySelector(`input[data-shot="${shotId}"][data-field="motion_length_sec"]`);
  if (motionLenEl) {
    const v = motionLenEl.value.trim();
    shot.motion_length_sec = v === '' ? null : (parseFloat(v) || null);
  }
  await api(`/api/spec/${r.reel_id}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(r),
  });
  if (!silent) state.reels = state.reels.map(x => x.reel_id === r.reel_id ? r : x);
}

function spec_voice_seed_placeholder(r) {
  return r.voice && r.voice.seed ? String(r.voice.seed) : '12345';
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function pipelineStatus(r) {
  const scriptDone = r.shots.some(s => (s.voice_line || '').trim() && !s.voice_line.startsWith('('));
  const voiceShotsNeeded = r.shots.filter(s => {
    const t = (s.voice_line || '').trim();
    return t && !(t.startsWith('(') && t.endsWith(')'));
  });
  const voiceShotsDone = voiceShotsNeeded.filter(s => s.voice_exists).length;
  const voiceAllShots = voiceShotsDone === voiceShotsNeeded.length && voiceShotsNeeded.length > 0;
  const imgsDone = r.shots.filter(s => s.image_exists).length;
  const imgsTotal = r.shots.length;
  const imgsAllDone = imgsDone === imgsTotal && imgsTotal > 0;
  const motionDone = r.shots.filter(s => s.motion_exists).length;

  return {
    pills: [
      { cls: scriptDone ? 'done' : 'todo', icon: scriptDone ? '✓' : '○', label: 'Script' },
      { cls: voiceAllShots ? 'done' : (voiceShotsDone > 0 ? 'partial' : 'todo'), icon: voiceAllShots ? '✓' : (voiceShotsDone > 0 ? '◐' : '○'), label: `Voice shots ${voiceShotsDone}/${voiceShotsNeeded.length}` },
      { cls: imgsAllDone ? 'done' : (imgsDone > 0 ? 'partial' : 'todo'), icon: imgsAllDone ? '✓' : (imgsDone > 0 ? '◐' : '○'), label: `Images ${imgsDone}/${imgsTotal}` },
      { cls: motionDone === imgsTotal && imgsTotal > 0 ? 'done' : (motionDone > 0 ? 'partial' : 'todo'), icon: motionDone === imgsTotal && imgsTotal > 0 ? '✓' : (motionDone > 0 ? '◐' : '○'), label: `Motion ${motionDone}/${imgsTotal}` },
    ],
    canBuild: voiceAllShots && imgsAllDone,
    composedDone: !!(r.voice && r.voice.exists),
  };
}

document.getElementById('btn-higgs-toggle').addEventListener('click', async (ev) => {
  const btn = ev.currentTarget;
  const action = btn.dataset.action;
  if (!action) return;
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = action === 'unload' ? 'unloading…' : 'reloading…';
  try {
    const r = await api('/api/higgs/' + action, { method: 'POST' });
    if (action === 'unload') {
      const before = r.vram_allocated_gb_before;
      const after = r.vram_allocated_gb_after;
      toast(`Higgs unloaded · VRAM ${before ?? '?'} GB → ${after ?? '?'} GB. ComfyUI tiene la VRAM.`, 'ok', 5000);
    } else {
      toast(`Higgs reloaded · VRAM ${r.vram_allocated_gb ?? '?'} GB`, 'ok', 4000);
    }
  } catch (e) {
    toast(`${action} failed: ${e.message}`, 'err', 6000);
    btn.textContent = original;
    btn.disabled = false;
    return;
  }
  refreshHealth();
});

refreshHealth();
loadAll().then(loadSystem).catch(e => toast('Initial load failed: ' + e.message, 'err', 8000));
setInterval(refreshHealth, 5000);
setInterval(() => { if (state.active === SYSTEM_TAB) loadSystem(); }, 15000);
</script>
</body>
</html>
