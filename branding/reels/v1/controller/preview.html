<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel preview — Frequency Vibes</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #14141c;
    --panel-2: #1c1d27;
    --line: #2a2c3a;
    --text: #e7e6e0;
    --dim: #8b8a82;
    --gold: #d4a866;
    --teal: #6fcfc7;
    --ok: #6fcf97;
    --err: #d57878;
    --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }
  body { display: flex; flex-direction: column; align-items: center; padding: 32px 24px 64px; }
  a.back { color: var(--dim); text-decoration: none; font: 12px var(--mono); margin-bottom: 12px; align-self: flex-start; }
  a.back:hover { color: var(--gold); }
  h1 { font: 600 26px/1.2 var(--serif); letter-spacing: 0.01em; margin: 0 0 6px; text-align: center; }
  .meta { color: var(--dim); font: 12px var(--mono); margin-bottom: 24px; text-align: center; }

  .video-wrap {
    background: #000;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    width: min(420px, 90vw);
    aspect-ratio: 9/16;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font: 13px var(--mono);
  }
  .video-wrap video { width: 100%; height: 100%; object-fit: contain; }

  .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button, a.btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 22px;
    cursor: pointer;
    font: 600 14px sans-serif;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
  }
  button:hover, a.btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  button.primary, a.btn.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); }
  button.primary:hover, a.btn.primary:hover { background: #e6bc7a; color: #1a1408; }
  a.btn.download { background: var(--teal); color: #0b0b0f; border-color: var(--teal); }
  a.btn.download:hover { background: #8addd5; color: #0b0b0f; }

  .info { margin-top: 18px; color: var(--dim); font: 12px var(--mono); text-align: center; }

  .render-progress { margin-top: 24px; padding: 16px 20px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; max-width: 420px; width: 100%; text-align: center; }
  .render-progress.error { border-color: var(--err); color: #ffb6b6; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .share-hints {
    margin-top: 28px;
    padding: 16px 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    max-width: 420px;
    width: 100%;
    color: var(--dim);
    font: 12px var(--mono);
  }
  .share-hints b { color: var(--text); font-weight: 600; }
  .share-hints code { color: var(--gold); background: rgba(212,168,102,0.08); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
  <a href="/index.html" class="back">← back to controller</a>

  <h1 id="title">Reel preview</h1>
  <div class="meta" id="meta">loading…</div>

  <div class="video-wrap" id="video-wrap">
    <span>checking render…</span>
  </div>

  <div class="actions" id="actions"></div>

  <div class="info" id="info"></div>

  <div class="share-hints">
    <b>To share with Eugene</b><br>
    1. Click <b>⬇ Download .mp4</b> — file lands in your Downloads folder<br>
    2. Open WhatsApp Web (or your phone) and drag/attach the .mp4<br>
    3. Or use the <code>share</code> URL in the same Wi-Fi: <code id="lan-url">computing…</code>
  </div>

<script>
const params = new URLSearchParams(location.search);
const REEL_ID = params.get('reel');
if (!REEL_ID) {
  document.body.innerHTML = '<p style="color:var(--err);padding:32px">Missing ?reel=&lt;reel_id&gt; in URL</p>';
  throw new Error('reel missing');
}

document.getElementById('lan-url').textContent =
  `http://${location.hostname === 'localhost' ? location.hostname : location.host.split(':')[0]}:8766/preview.html?reel=${REEL_ID}`;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = await res.text();
    try { msg = JSON.parse(msg).error || msg; } catch (_) {}
    throw new Error(msg || `HTTP ${res.status}`);
  }
  return res.json();
}

async function loadSpec() {
  const spec = await api(`/api/spec/${REEL_ID}`);
  document.getElementById('title').textContent = spec.title || REEL_ID;
  const dur = spec.voice?.duration_sec ? ` · ${spec.voice.duration_sec}s` : '';
  document.getElementById('meta').textContent = `${spec.shots.length} shots${dur} · 1080×1920 vertical · target ≤${spec.duration_target_sec}s`;
  return spec;
}

function renderActions(spec, hasRender, mp4Url, sizeBytes) {
  const a = document.getElementById('actions');
  a.innerHTML = '';
  const info = document.getElementById('info');

  if (hasRender) {
    info.textContent = `render.mp4 ready · ${(sizeBytes/1024/1024).toFixed(2)} MB`;

    const dl = document.createElement('a');
    dl.className = 'btn download';
    dl.href = mp4Url;
    dl.download = `${REEL_ID}.mp4`;
    dl.innerHTML = '⬇ Download .mp4';
    a.appendChild(dl);

    const re = document.createElement('button');
    re.textContent = '🎬 Re-render';
    re.onclick = () => triggerRender(spec);
    a.appendChild(re);
  } else {
    info.textContent = 'no render yet';
    const r = document.createElement('button');
    r.className = 'primary';
    r.innerHTML = '🎬 Render video now';
    r.onclick = () => triggerRender(spec);
    a.appendChild(r);
  }
}

async function triggerRender(spec) {
  const wrap = document.getElementById('video-wrap');
  wrap.innerHTML = '<span><span class="spinner"></span>rendering... 30-90s</span>';
  document.getElementById('actions').innerHTML = '';
  document.getElementById('info').textContent = 'ffmpeg working...';
  try {
    const out = await api(`/api/render/${REEL_ID}`, { method: 'POST' });
    document.getElementById('info').textContent = `render.mp4 ready · ${out.size_mb} MB`;
    await checkAndDisplay(spec);
  } catch (e) {
    wrap.innerHTML = `<span style="color:var(--err)">render failed</span>`;
    document.getElementById('info').textContent = e.message;
  }
}

async function checkAndDisplay(spec) {
  const wrap = document.getElementById('video-wrap');
  try {
    const res = await fetch(`/api/render/${REEL_ID}?t=${Date.now()}`);
    if (!res.ok) {
      wrap.innerHTML = '<span>no render.mp4 yet — click "Render video now"</span>';
      renderActions(spec, false, null, 0);
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    wrap.innerHTML = `<video controls autoplay muted playsinline src="${url}"></video>`;
    renderActions(spec, true, url, blob.size);
  } catch (e) {
    wrap.innerHTML = `<span style="color:var(--err)">error: ${e.message}</span>`;
  }
}

(async () => {
  try {
    const spec = await loadSpec();
    await checkAndDisplay(spec);
  } catch (e) {
    document.getElementById('meta').innerHTML = `<span style="color:var(--err)">load failed: ${e.message}</span>`;
  }
})();
</script>
</body>
</html>
