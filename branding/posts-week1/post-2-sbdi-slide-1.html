<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Post 2 SBDI · Slide 1/6 · Cover</title>
<link rel="stylesheet" href="base.css">
<style>
  body { background: #07070a; }
  .canvas-square {
    background: linear-gradient(135deg, #142a2c 0%, #0a0e10 100%);
    padding: 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .canvas-square::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 10%, rgba(212,168,102,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 95%, rgba(42, 139, 150, 0.12), transparent 55%);
    pointer-events: none;
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; position: relative; }
  .mark { width: 80px; height: 80px; border-radius: 8px;
    background: url('../frequency-vibes-logo-teal-clean.png') center/cover; opacity: 0.94; }
  .slide-num { font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.36em; color: var(--gold); opacity: 0.75; }
  .center { position: relative; text-align: center; margin-top: -40px; }
  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px; letter-spacing: 0.46em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 36px;
  }
  .partner-name {
    font-family: 'Fraunces', serif; font-weight: 300;
    font-size: 112px; line-height: 1.02; color: var(--ink);
    letter-spacing: -0.025em; margin-bottom: 28px;
  }
  .partner-name em { color: var(--gold); font-weight: 400; font-style: italic; }
  .partner-tag {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 38px; line-height: 1.3;
    color: rgba(244, 236, 220, 0.78); max-width: 84%; margin: 0 auto;
  }
  .bottom { position: relative; display: flex; align-items: center; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace; font-size: 18px;
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--gold); opacity: 0.9;
    border-top: 1px solid rgba(212, 168, 102, 0.28); padding-top: 22px;
  }
</style></head>
<body>
<div class="canvas-square">
  <div class="top-row">
    <div class="mark"></div>
    <div class="slide-num">01 / 06</div>
  </div>
  <div class="center">
    <div class="kicker">Frequency Foods · Center</div>
    <div class="partner-name">Unity in <em>Diversity</em></div>
    <div class="partner-tag">Is not a slogan.<br>It is <em>SDG 18</em>.</div>
  </div>
  <div class="bottom">
    <span>SBDI Center · UN GC 2025</span>
    <span>Swipe →</span>
  </div>
</div>
</body></html>
