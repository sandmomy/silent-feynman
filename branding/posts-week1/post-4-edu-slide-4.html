<!doctype html>

<title>Post 4 EDU · Slide 4/5 · The route</title>
<link rel="stylesheet" href="base.css">
<style>
  body { background: #efe7d3; }
  .canvas-square { background: var(--cream); color: #1a0f00; padding: 88px;

  .num-mark { font-family: 'Fraunces', serif; font-weight: 200; font-size: 200px;
