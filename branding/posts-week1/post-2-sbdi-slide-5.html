<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Post 2 SBDI · Slide 5/6 · Feb 2026 launch</title>
<link rel="stylesheet" href="base.css">
<style>
  body { background: #07070a; }
  .canvas-square {
    background: linear-gradient(135deg, #142a2c 0%, #0a0e10 100%);
    padding: 88px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .mark { width: 64px; height: 64px; border-radius: 8px;
    background: url('../frequency-vibes-logo-teal-clean.png') center/cover; opacity: 0.94; }
  .slide-num { font-family: 'IBM Plex Mono', monospace; font-size: 18px; letter-spacing: 0.36em; color: var(--gold); opacity: 0.75; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; margin-top: 30px; }
  .stat { border-top: 1px solid rgba(212, 168, 102, 0.35); padding-top: 22px; }
  .stat .num { font-family: 'Fraunces', serif; font-weight: 200; font-size: 144px; color: var(--gold); line-height: 0.95; letter-spacing: -0.045em; }
  .stat .lab { font-family: 'IBM Plex Mono', monospace; font-size: 16px; letter-spacing: 0.34em; text-transform: uppercase; color: rgba(244, 236, 220, 0.7); margin-top: 12px; }
  .head { font-family: 'Fraunces', serif; font-weight: 300; font-size: 64px;
    line-height: 1.1; color: var(--ink); letter-spacing: -0.02em; }
  .head em { color: var(--gold); font-style: italic; font-weight: 400; }
  .bottom { display: flex; align-items: center; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace; font-size: 16px;
    letter-spacing: 0.36em; text-transform: uppercase;
    color: rgba(212, 168, 102, 0.85);
    border-top: 1px solid rgba(212, 168, 102, 0.28); padding-top: 18px; }
</style></head>
<body>
<div class="canvas-square">
  <div class="top-row">
    <div class="mark"></div>
    <div class="slide-num">05 / 06</div>
  </div>
  <div>
    <div class="head">What's <em>coming</em>:<br>Feb 20, 2026.</div>
    <div class="stat-grid">
      <div class="stat"><div class="num">100</div><div class="lab">Trainers</div></div>
      <div class="stat"><div class="num">2</div><div class="lab">Weeks</div></div>
      <div class="stat"><div class="num">5+</div><div class="lab">African countries</div></div>
      <div class="stat"><div class="num">1</div><div class="lab">Bio-organic curriculum</div></div>
    </div>
  </div>
  <div class="bottom">
    <span>SBDI · Indonesia ⇄ Africa</span>
    <span>Swipe →</span>
  </div>
</div>
</body></html>
