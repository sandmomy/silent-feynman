<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Frequency Vibes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060913;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #ffffff;
      --text-muted: #a0abc0;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(212, 175, 55, 0.26);
      --font-body: "Inter", system-ui, sans-serif;
      --font-brand: "Tangerine", cursive;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.14);
      --green-border: rgba(74, 222, 128, 0.35);
      --orange: #f59e0b;
      --orange-bg: rgba(245, 158, 11, 0.14);
      --orange-border: rgba(245, 158, 11, 0.35);
      --red: #ef4444;
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.14);
      --blue-border: rgba(59, 130, 246, 0.35);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(212, 175, 55, 0.06), transparent 24%),
        linear-gradient(180deg, #04070f 0%, var(--bg-base) 45%, #07101d 100%);
    }

    .admin-page {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px clamp(16px, 4vw, 48px) 56px;
    }

    /* NAV */
    .admin-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .nav-brand {
      font-family: var(--font-brand);
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
    }

    .nav-actions { display: flex; gap: 10px; align-items: center; }

    .btn-logout {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .btn-logout:hover { color: var(--text-main); border-color: rgba(255,255,255,0.2); }

    /* LOGIN */
    .login-card {
      max-width: 400px;
      margin: 120px auto;
      padding: 40px 32px;
      border-radius: 24px;
      border: 1px solid var(--border-gold);
      background: linear-gradient(145deg, rgba(9,14,25,0.92), rgba(8,12,22,0.78));
      text-align: center;
    }

    .login-title {
      font-family: var(--font-brand);
      font-size: 2.8rem;
      margin: 0 0 8px;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0 0 28px;
    }

    .login-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border-light);
      background: rgba(255,255,255,0.04);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 15px;
      outline: none;
      text-align: center;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    .login-input:focus { border-color: var(--gold-primary); }

    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: 1px solid var(--border-gold);
      background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.08));
      color: var(--gold-light);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .login-btn:hover { background: linear-gradient(135deg, rgba(212,175,55,0.28), rgba(212,175,55,0.14)); }

    .login-error {
      color: var(--red);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* STATS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      padding: 20px;
      border-radius: 18px;
      border: 1px solid var(--border-light);
      background: rgba(255,255,255,0.03);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* TABLE */
    .bookings-card {
      border-radius: 24px;
      border: 1px solid var(--border-light);
      background: linear-gradient(145deg, rgba(9,14,25,0.92), rgba(8,12,22,0.78));
      overflow: hidden;
    }

    .bookings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .bookings-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .btn-refresh {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .btn-refresh:hover { color: var(--text-main); }

    .bookings-empty {
      padding: 60px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .booking-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-light);
      align-items: center;
    }

    .booking-item:last-child { border-bottom: none; }

    .booking-info { display: flex; flex-direction: column; gap: 4px; }

    .booking-name {
      font-size: 15px;
      font-weight: 600;
    }

    .booking-details {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .booking-detail-item { display: flex; align-items: center; gap: 4px; }

    .booking-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* STATUS BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-green {
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      color: var(--green);
    }

    .badge-orange {
      background: var(--orange-bg);
      border: 1px solid var(--orange-border);
      color: var(--orange);
    }

    .badge-blue {
      background: var(--blue-bg);
      border: 1px solid var(--blue-border);
      color: var(--blue);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ACTION BUTTONS */
    .btn-action {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-gold);
      background: linear-gradient(135deg, rgba(212,175,55,0.14), rgba(212,175,55,0.06));
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn-action:hover { background: linear-gradient(135deg, rgba(212,175,55,0.24), rgba(212,175,55,0.12)); }

    .btn-action:disabled { opacity: 0.4; pointer-events: none; }

    .btn-whatsapp {
      background: linear-gradient(135deg, rgba(37,211,102,0.14), rgba(37,211,102,0.06));
      border-color: rgba(37,211,102,0.35);
      color: #25d366;
    }

    .btn-whatsapp:hover { background: linear-gradient(135deg, rgba(37,211,102,0.24), rgba(37,211,102,0.12)); }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.visible { display: flex; }

    .modal-card {
      max-width: 480px;
      width: 100%;
      padding: 32px;
      border-radius: 24px;
      border: 1px solid var(--border-gold);
      background: linear-gradient(145deg, #0a0f19, #080c14);
    }

    .modal-title { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    .modal-text { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; line-height: 1.6; }

    .modal-actions { display: flex; gap: 10px; }

    .modal-btn-cancel {
      flex: 1;
      padding: 12px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-btn-confirm {
      flex: 1;
      padding: 12px;
      border-radius: 999px;
      border: 1px solid var(--border-gold);
      background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.08));
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .link-copy {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-light);
      word-break: break-all;
      font-size: 13px;
      color: var(--gold-light);
      display: none;
    }

    [hidden] { display: none !important; }

    @media (max-width: 640px) {
      .booking-item { grid-template-columns: 1fr; }
      .booking-actions { justify-content: flex-start; }
      .stats-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="admin-page">
    <!-- LOGIN VIEW -->
    <div id="view-login">
      <div class="login-card">
        <h1 class="login-title">Frequency Vibes</h1>
        <p class="login-subtitle">Admin Panel</p>
        <form id="login-form">
          <input type="password" class="login-input" id="login-password" placeholder="Enter password" autocomplete="current-password">
          <button type="submit" class="login-btn">Access Panel</button>
        </form>
        <p class="login-error" id="login-error">Invalid password</p>
      </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="view-admin" hidden>
      <nav class="admin-nav">
        <a href="index.html" class="nav-brand">Frequency Vibes</a>
        <div class="nav-actions">
          <button class="btn-logout" id="btn-logout">Logout</button>
        </div>
      </nav>

      <div class="stats-row">
        <div class="stat-card">
          <p class="stat-label">Total Bookings</p>
          <p class="stat-value" id="stat-total">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Deposits Paid</p>
          <p class="stat-value" id="stat-deposits" style="color:var(--green)">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Fully Completed</p>
          <p class="stat-value" id="stat-completed" style="color:var(--gold-primary)">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Total Revenue</p>
          <p class="stat-value" id="stat-revenue" style="color:var(--gold-light)">-</p>
        </div>
      </div>

      <div class="bookings-card">
        <div class="bookings-header">
          <h2 class="bookings-title">Retreat Bookings</h2>
          <button class="btn-refresh" id="btn-refresh">Refresh</button>
        </div>
        <div id="bookings-list">
          <div class="bookings-empty">Loading bookings...</div>
        </div>
      </div>
    </div>

    <!-- SEND PAYMENT MODAL -->
    <div class="modal-overlay" id="modal-payment">
      <div class="modal-card">
        <h3 class="modal-title">Send Final Payment</h3>
        <p class="modal-text" id="modal-text">Generate a payment link for the remaining balance and send it to the client.</p>
        <div class="link-copy" id="modal-link"></div>
        <div class="modal-actions">
          <button class="modal-btn-cancel" id="modal-cancel">Cancel</button>
          <button class="modal-btn-confirm" id="modal-confirm">Generate Link</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var TOKEN_KEY = "fv_admin_token";
    var loginView = document.getElementById("view-login");
    var adminView = document.getElementById("view-admin");
    var loginForm = document.getElementById("login-form");
    var loginError = document.getElementById("login-error");
    var listEl = document.getElementById("bookings-list");
    var modal = document.getElementById("modal-payment");
    var modalText = document.getElementById("modal-text");
    var modalLink = document.getElementById("modal-link");
    var modalCancel = document.getElementById("modal-cancel");
    var modalConfirm = document.getElementById("modal-confirm");
    var pendingBookingId = null;

    function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(TOKEN_KEY); }

    function showAdmin() {
      loginView.hidden = true;
      adminView.hidden = false;
      loadBookings();
    }

    function showLogin() {
      loginView.hidden = false;
      adminView.hidden = true;
      clearToken();
    }

    // LOGIN
    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      loginError.style.display = "none";
      var pw = document.getElementById("login-password").value;

      fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw }),
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.data.error);
          setToken(res.data.token);
          showAdmin();
        })
        .catch(function () {
          loginError.style.display = "block";
        });
    });

    // LOGOUT
    document.getElementById("btn-logout").addEventListener("click", showLogin);

    // LOAD BOOKINGS
    function loadBookings() {
      fetch("/api/admin/bookings", {
        headers: { Authorization: "Bearer " + getToken() },
      })
        .then(function (r) {
          if (r.status === 401) { showLogin(); throw new Error("unauthorized"); }
          return r.json();
        })
        .then(function (data) {
          renderBookings(data.bookings || []);
        })
        .catch(function (err) {
          if (err.message !== "unauthorized") {
            listEl.innerHTML = '<div class="bookings-empty">Failed to load bookings.</div>';
          }
        });
    }

    function renderBookings(bookings) {
      // Stats
      document.getElementById("stat-total").textContent = bookings.length;
      var deposits = bookings.filter(function (b) { return b.deposit_paid; }).length;
      var completed = bookings.filter(function (b) { return b.full_payment_paid; }).length;
      document.getElementById("stat-deposits").textContent = deposits;
      document.getElementById("stat-completed").textContent = completed;

      var revenue = bookings.reduce(function (sum, b) {
        var dep = b.deposit_paid ? (b.deposit_amount || 0) : 0;
        var full = b.full_payment_paid ? (b.full_payment_amount || 0) : 0;
        return sum + dep + full;
      }, 0);
      document.getElementById("stat-revenue").textContent = "\u20AC" + (revenue / 100).toLocaleString("en");

      if (!bookings.length) {
        listEl.innerHTML = '<div class="bookings-empty">No bookings yet. When someone pays a deposit, it will appear here.</div>';
        return;
      }

      listEl.innerHTML = bookings.map(function (b) {
        var statusBadge = "";
        if (b.full_payment_paid) {
          statusBadge = '<span class="badge badge-green"><span class="badge-dot"></span>Completed</span>';
        } else if (b.status === "payment_sent") {
          statusBadge = '<span class="badge badge-blue"><span class="badge-dot"></span>Payment Sent</span>';
        } else if (b.deposit_paid) {
          statusBadge = '<span class="badge badge-orange"><span class="badge-dot"></span>Deposit Paid</span>';
        } else {
          statusBadge = '<span class="badge" style="border:1px solid var(--border-light);color:var(--text-muted)"><span class="badge-dot"></span>Pending</span>';
        }

        var guests = b.guests || 1;
        var date = b.created_at ? new Date(b.created_at + "Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
        var phone = b.phone || "";
        var whatsappLink = phone ? "https://wa.me/" + phone.replace(/[^0-9]/g, "") : "";

        var sendBtn = "";
        if (b.deposit_paid && !b.full_payment_paid && b.status !== "payment_sent") {
          sendBtn = '<button class="btn-action" onclick="window.__sendPayment(' + b.id + ',\'' + (b.first_name || "") + " " + (b.last_name || "") + '\')">Send Final Payment</button>';
        }

        var whatsBtn = "";
        if (whatsappLink) {
          whatsBtn = '<a href="' + whatsappLink + '" target="_blank" rel="noopener" class="btn-action btn-whatsapp">WhatsApp</a>';
        }

        return '<div class="booking-item">' +
          '<div class="booking-info">' +
            '<div class="booking-name">' + (b.first_name || "") + " " + (b.last_name || "") + "</div>" +
            '<div class="booking-details">' +
              '<span class="booking-detail-item">' + (b.email || "") + "</span>" +
              '<span class="booking-detail-item">' + guests + " guest" + (guests > 1 ? "s" : "") + "</span>" +
              '<span class="booking-detail-item">' + (b.country || "") + "</span>" +
              '<span class="booking-detail-item">' + date + "</span>" +
            "</div>" +
          "</div>" +
          '<div class="booking-actions">' + statusBadge + sendBtn + whatsBtn + "</div>" +
        "</div>";
      }).join("");
    }

    // SEND PAYMENT
    window.__sendPayment = function (id, name) {
      pendingBookingId = id;
      modalText.textContent = 'Generate a payment link for ' + name + ' for the remaining \u20AC7,000 balance.';
      modalLink.style.display = "none";
      modalLink.textContent = "";
      modalConfirm.textContent = "Generate Link";
      modalConfirm.disabled = false;
      modal.classList.add("visible");
    };

    modalCancel.addEventListener("click", function () {
      modal.classList.remove("visible");
      pendingBookingId = null;
    });

    modalConfirm.addEventListener("click", function () {
      if (!pendingBookingId) return;
      modalConfirm.textContent = "Generating...";
      modalConfirm.disabled = true;

      fetch("/api/admin/send-payment", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + getToken(),
        },
        body: JSON.stringify({ bookingId: pendingBookingId }),
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.checkoutUrl) {
            modalLink.textContent = data.checkoutUrl;
            modalLink.style.display = "block";
            modalConfirm.textContent = "Copy Link";
            modalConfirm.disabled = false;
            modalConfirm.onclick = function () {
              navigator.clipboard.writeText(data.checkoutUrl).then(function () {
                modalConfirm.textContent = "Copied!";
                setTimeout(function () {
                  modal.classList.remove("visible");
                  loadBookings();
                }, 1000);
              });
            };
          } else {
            modalText.textContent = data.error || "Failed to generate link.";
            modalConfirm.textContent = "Close";
            modalConfirm.disabled = false;
            modalConfirm.onclick = function () { modal.classList.remove("visible"); };
          }
        })
        .catch(function () {
          modalText.textContent = "Failed to generate payment link.";
          modalConfirm.textContent = "Close";
          modalConfirm.disabled = false;
          modalConfirm.onclick = function () { modal.classList.remove("visible"); };
        });
    });

    // REFRESH
    document.getElementById("btn-refresh").addEventListener("click", loadBookings);

    // AUTO LOGIN
    if (getToken()) {
      showAdmin();
    }
  })();
  </script>
</body>
</html>
