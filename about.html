    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #030305;
            --accent: #8b5cf6;
            --accent-light: #c4b5fd;
            --accent-dark: #6d28d9;
        }

        html,
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Imagen de fondo — absolute en vez de fixed para evitar repaints */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./assets/optimized/meditation-bg.1600w.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        .scroll-container {
            height: 200vh;
            /* Menos scroll necesario */
            position: relative;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 300;
            color: var(--accent-light);
            text-decoration: none;
            letter-spacing: 0.08em;
        }

        .nav-links {
            display: flex;
            gap: 36px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-light);
        }

        /* Progress bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent), var(--accent-light));
            width: 0%;
            z-index: 1000;
            box-shadow: 0 0 15px var(--accent);
        }

        /* Section indicators */
        .section-indicator {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 100;
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid rgba(139, 92, 246, 0.4);
            background: transparent;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .indicator-dot:hover {
            border-color: var(--accent);
            transform: scale(1.3);
        }

        .indicator-dot.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
            transform: scale(1.3);
        }

        /* Page counter */
        .page-counter {
            position: fixed;
            bottom: 40px;
            left: 40px;
            font-family: 'Cormorant Garamond', serif;
            z-index: 100;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .page-counter__current {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--accent-light);
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        .page-counter__total {
            font-size: 1rem;
            color: rgba(139, 92, 246, 0.5);
        }

        /* Section name */
        .section-name {
            position: fixed;
            top: 50%;
            left: 40px;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: left center;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.25);
            z-index: 100;
            transition: color 0.5s ease;
        }

        /* Scroll hint */
        .scroll-hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0.5;
            transition: opacity 0.4s ease;
        }

        .scroll-hint span {
            font-size: 0.55rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }

        .scroll-hint__line {
            width: 1px;
            height: 40px;
            background: linear-gradient(180deg, var(--accent), transparent);
            animation: scrollPulse 2s ease-in-out infinite;
        }

        @keyframes scrollPulse {

            0%,
            100% {
                opacity: 1;
                height: 40px;
            }

            50% {
                opacity: 0.3;
                height: 25px;
            }
        }

        /* Corner accents */
        .corner-accent {
            position: fixed;
            width: 60px;
            height: 60px;
            z-index: 100;
            pointer-events: none;
        }

        .corner-accent--tl {
            top: 20px;
            left: 20px;
            border-left: 1px solid rgba(139, 92, 246, 0.2);
            border-top: 1px solid rgba(139, 92, 246, 0.2);
        }

        .corner-accent--br {
            bottom: 20px;
            right: 20px;
            border-right: 1px solid rgba(139, 92, 246, 0.2);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            nav {
                padding: 20px;
            }

            .section-indicator {
                right: 15px;
            }

            .page-counter {
                left: 20px;
                bottom: 20px;
            }

            .section-name {
                display: none;
            }

            .corner-accent {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>

    <script>
        document.fonts.ready.then(() => init());

        function init() {
            // ScrollTrigger eliminado — se usa postMessage desde el padre

            const container = document.getElementById('canvas-container');
            const progressBar = document.getElementById('progressBar');
            const dots = document.querySelectorAll('.indicator-dot');
            const pageNum = document.getElementById('pageNum');
            const sectionNameEl = document.getElementById('sectionName');
            const scrollHint = document.getElementById('scrollHint');

            // Variables globales para interacción
            let mouseX = 0;
            let mouseY = 0;
            let windowHalfX = window.innerWidth / 2;
            let windowHalfY = window.innerHeight / 2;

            function onDocumentMouseMove(event) {
                mouseX = (event.clientX - windowHalfX);
                mouseY = (event.clientY - windowHalfY);
            }

            function onDocumentTouchMove(event) {
                if (event.touches.length === 1) {
                    event.preventDefault();
                    mouseX = event.touches[0].pageX - windowHalfX;
                    mouseY = event.touches[0].pageY - windowHalfY;
                }
            }

            function onWindowResize() {
                windowHalfX = window.innerWidth / 2;
                windowHalfY = window.innerHeight / 2;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            }

            document.addEventListener('mousemove', onDocumentMouseMove, false);
            document.addEventListener('touchmove', onDocumentTouchMove, { passive: false });
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    onWindowResize();
                }, 150);
            }, false);

            // --- CONFIGURACIÓN DE ESCENA THREE.JS ---
            // Scene
            const scene = new THREE.Scene();
            // Fondo transparente para ver la imagen de fondo
            scene.background = null;
            // Sin fog para mantener transparencia

            // Camera (FOV amplio para ver paneles y símbolos)
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 0, 25); // Posición inicial

            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Post-processing (sin bloom para partículas más limpias)
            const composer = new THREE.EffectComposer(renderer);
            composer.addPass(new THREE.RenderPass(scene, camera));

            // Colors
            const accentColor = new THREE.Color(0x8b5cf6);
            const accentLight = new THREE.Color(0xc4b5fd);

            // ============================================
            // PANEL CONTENT
            // ============================================
            const panelContents = [
                {
                    label: '',
                    title: '',
                    body: '',
                    symbol: 'merkaba',
                    type: 'intro' // Ghost slide
                },
                {
                    label: 'INTRODUCTION',
                    title: "Eugene\nMierak",
                    body: "A frequency practitioner\nspecializing in alignment coaching,\ncoherence training,\nand energetic training,\nworking through integrative\ncoherence methodologies to support\nclarity, stability,\nand conscious evolution.",
                    symbol: 'merkaba'
                },
                {
                    label: 'THE WORK',
                    title: 'Bridging\nWorlds',
                    body: "My work bridges subtle\nfrequency sciences with practical\nframeworks for personal,\norganizational, and planetary\nalignment, helping individuals\ncultivate resonance in real-world\ndecisions, leadership dynamics,\nand long-term projects.",
                    symbol: 'flowerOfLife'
                },
                {
                    label: 'SBDI & MISSION',
                    title: 'Global\nImpact',
                    body: "As Director of International\nRelationships for the SBDI\nFoundation, I foster global\npartnerships that support holistic\nsustainability and regenerative\ndevelopment across cultures.\n\nMy mission: coherent, sustainable\nprojects through frequency\nawareness and conscious\ninternational cooperation—\ncreating lasting impact\nfor communities and the planet.",
                    symbol: 'torus'
                }
            ];

            // Panel 3D positions (a la izquierda, delante de los símbolos) - 4 paneles
            // Espaciado uniforme para mejor sincronización con scroll
            const panelPositions = [
                { pos: new THREE.Vector3(0, 0, 80), rot: new THREE.Vector3(0, 0, 0) }, // Intro (Invisible)
                { pos: new THREE.Vector3(-8, 0, -3), rot: new THREE.Vector3(0, 0.1, 0) },
                { pos: new THREE.Vector3(-8, 0, -63), rot: new THREE.Vector3(0, 0.1, 0) },
                { pos: new THREE.Vector3(-8, 0, -123), rot: new THREE.Vector3(0, 0.1, 0) }
            ];

            // Symbol base offset (all symbols generated at origin, positioned via camera movement)
            const symbolBaseOffset = new THREE.Vector3(0, 0, 0);

            // ============================================
            // CREATE TEXT PANEL TEXTURE
            // ============================================
            function createPanelTexture(content, width = 900, height = 850) {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                // Background base — deep space
                ctx.fillStyle = 'rgba(3, 2, 12, 0.98)';
                ctx.fillRect(0, 0, width, height);

                // Nebula layer 1 — large purple cloud (upper left)
                const neb1 = ctx.createRadialGradient(width * 0.25, height * 0.3, 0, width * 0.25, height * 0.3, width * 0.7);
                neb1.addColorStop(0, 'rgba(120, 40, 200, 0.28)');
                neb1.addColorStop(0.3, 'rgba(90, 30, 170, 0.15)');
                neb1.addColorStop(0.6, 'rgba(60, 20, 130, 0.06)');
                neb1.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = neb1;
                ctx.fillRect(0, 0, width, height);

                // Nebula layer 2 — deep blue mass (lower right)
                const neb2 = ctx.createRadialGradient(width * 0.8, height * 0.72, 0, width * 0.8, height * 0.72, width * 0.6);
                neb2.addColorStop(0, 'rgba(25, 60, 180, 0.22)');
                neb2.addColorStop(0.35, 'rgba(20, 40, 140, 0.12)');
                neb2.addColorStop(0.7, 'rgba(15, 25, 100, 0.05)');
                neb2.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = neb2;
                ctx.fillRect(0, 0, width, height);

                // Nebula layer 3 — hot violet core (center-left)
                const neb3 = ctx.createRadialGradient(width * 0.4, height * 0.5, 0, width * 0.4, height * 0.5, width * 0.4);
                neb3.addColorStop(0, 'rgba(160, 80, 255, 0.15)');
                neb3.addColorStop(0.4, 'rgba(120, 50, 220, 0.07)');
                neb3.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = neb3;
                ctx.fillRect(0, 0, width, height);

                // Nebula layer 4 — cyan wisp (top right)
                const neb4 = ctx.createRadialGradient(width * 0.85, height * 0.12, 0, width * 0.85, height * 0.12, width * 0.4);
                neb4.addColorStop(0, 'rgba(40, 160, 210, 0.16)');
                neb4.addColorStop(0.4, 'rgba(30, 110, 170, 0.07)');
                neb4.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = neb4;
                ctx.fillRect(0, 0, width, height);

                // Nebula layer 5 — magenta streak (bottom left)
                const neb5 = ctx.createRadialGradient(width * 0.1, height * 0.85, 0, width * 0.1, height * 0.85, width * 0.45);
                neb5.addColorStop(0, 'rgba(180, 40, 120, 0.13)');
                neb5.addColorStop(0.4, 'rgba(140, 30, 90, 0.06)');
                neb5.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = neb5;
                ctx.fillRect(0, 0, width, height);

                // Nebula layer 6 — warm gold hint (center right)
                const neb6 = ctx.createRadialGradient(width * 0.7, height * 0.4, 0, width * 0.7, height * 0.4, width * 0.3);
                neb6.addColorStop(0, 'rgba(200, 160, 60, 0.06)');
                neb6.addColorStop(0.5, 'rgba(180, 130, 40, 0.02)');
                neb6.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = neb6;
                ctx.fillRect(0, 0, width, height);

                // Cosmic dust — fine scattered particles
                const dustCount = 180;
                for (let s = 0; s < dustCount; s++) {
                    const sx = Math.random() * width;
                    const sy = Math.random() * height;
                    const sr = Math.random() * 0.8 + 0.2;
                    const sa = Math.random() * 0.25 + 0.03;
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(180, 180, 220, ${sa})`;
                    ctx.fill();
                }

                // Bright stars — fewer but more visible
                const starCount = 25;
                for (let s = 0; s < starCount; s++) {
                    const sx = Math.random() * width;
                    const sy = Math.random() * height;
                    const sr = Math.random() * 1.5 + 0.5;
                    const sa = Math.random() * 0.5 + 0.2;
                    // Star glow
                    const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 4);
                    glow.addColorStop(0, `rgba(220, 210, 255, ${sa})`);
                    glow.addColorStop(0.3, `rgba(180, 160, 240, ${sa * 0.3})`);
                    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = glow;
                    ctx.fillRect(sx - sr * 4, sy - sr * 4, sr * 8, sr * 8);
                    // Star core
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${sa + 0.1})`;
                    ctx.fill();
                }

                // Nebula filaments — subtle curved streaks
                ctx.globalCompositeOperation = 'screen';
                for (let f = 0; f < 5; f++) {
                    const fx = Math.random() * width;
                    const fy = Math.random() * height;
                    const fLen = 80 + Math.random() * 150;
                    const fAngle = Math.random() * Math.PI * 2;
                    const filGrad = ctx.createLinearGradient(
                        fx, fy,
                        fx + Math.cos(fAngle) * fLen,
                        fy + Math.sin(fAngle) * fLen
                    );
                    filGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
                    filGrad.addColorStop(0.3, `rgba(${100 + Math.random() * 80}, ${50 + Math.random() * 60}, ${180 + Math.random() * 75}, 0.04)`);
                    filGrad.addColorStop(0.7, `rgba(${100 + Math.random() * 80}, ${50 + Math.random() * 60}, ${180 + Math.random() * 75}, 0.04)`);
                    filGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.strokeStyle = filGrad;
                    ctx.lineWidth = 15 + Math.random() * 25;
                    ctx.beginPath();
                    ctx.moveTo(fx, fy);
                    ctx.quadraticCurveTo(
                        fx + Math.cos(fAngle + 0.5) * fLen * 0.6,
                        fy + Math.sin(fAngle + 0.5) * fLen * 0.6,
                        fx + Math.cos(fAngle) * fLen,
                        fy + Math.sin(fAngle) * fLen
                    );
                    ctx.stroke();
                }
                ctx.globalCompositeOperation = 'source-over';

                // Vignette — dark edges for depth
                const vignette = ctx.createRadialGradient(width / 2, height / 2, width * 0.2, width / 2, height / 2, width * 0.7);
                vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
                vignette.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, width, height);

                // Left border accent — glow line
                const gradient = ctx.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, 'rgba(139, 92, 246, 0)');
                gradient.addColorStop(0.2, 'rgba(100, 60, 200, 0.4)');
                gradient.addColorStop(0.5, 'rgba(139, 92, 246, 0.7)');
                gradient.addColorStop(0.8, 'rgba(100, 60, 200, 0.4)');
                gradient.addColorStop(1, 'rgba(139, 92, 246, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 2, height);
                // Left border soft glow
                const leftGlow = ctx.createLinearGradient(0, 0, 20, 0);
                leftGlow.addColorStop(0, 'rgba(139, 92, 246, 0.1)');
                leftGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = leftGlow;
                ctx.fillRect(0, 0, 20, height);

                // Top line with glow
                const topGradient = ctx.createLinearGradient(0, 0, width, 0);
                topGradient.addColorStop(0, 'rgba(139, 92, 246, 0)');
                topGradient.addColorStop(0.2, 'rgba(139, 92, 246, 0.5)');
                topGradient.addColorStop(0.8, 'rgba(139, 92, 246, 0.5)');
                topGradient.addColorStop(1, 'rgba(139, 92, 246, 0)');
                ctx.fillStyle = topGradient;
                ctx.fillRect(0, 0, width, 1);

                // Corner accents
                ctx.strokeStyle = 'rgba(139, 92, 246, 0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(width - 35, 8);
                ctx.lineTo(width - 8, 8);
                ctx.lineTo(width - 8, 35);

            // Create panels
            const panels = [];

            // ============================================

            const PARTICLE_COUNT = 50000;

            function createParticleTexture() {

            // ============================================
            // GENERADORES DE GEOMETRÍA SAGRADA - Alta Definición
            // ============================================
            const SymbolGenerators = {

                // MERKABA - Star Tetrahedron 3D con geometría correcta
                // Dos tetraedros regulares interpenetrados centrados en el origen
                merkaba(count) {
                    const points = [];
                    const scale = 2.8;

                    // =============================================
                    // GEOMETRÍA 3D DEL STAR TETRAHEDRON - CORRECTO
                    // Tetraedro regular: altura = sqrt(2/3) * edge
                    // Centro geométrico a 1/4 de altura desde la base
                    // =============================================

                    const h = scale; // Altura desde centro hasta apex
                    const r = scale * 0.82; // Radio de la base (para tetraedro regular)

                    // Tetraedro SUPERIOR (apex arriba, base abajo)
                    // Base es triángulo equilátero en Y = -h/3
                    const upVerts = [
                        { x: 0, y: h, z: 0 },                                  // Apex arriba
                        { x: r * Math.cos(0), y: -h * 0.33, z: r * Math.sin(0) },           // Base 0°
                        { x: r * Math.cos(2.094), y: -h * 0.33, z: r * Math.sin(2.094) },   // Base 120°
                        { x: r * Math.cos(4.189), y: -h * 0.33, z: r * Math.sin(4.189) }    // Base 240°
                    ];

                    // Tetraedro INFERIOR (apex abajo, base arriba)
                    // Base es triángulo equilátero en Y = +h/3, rotado 60° respecto al superior
                    const downVerts = [
                        { x: 0, y: -h, z: 0 },                                  // Apex abajo
                        { x: r * Math.cos(1.047), y: h * 0.33, z: r * Math.sin(1.047) },    // Base 60°
                        { x: r * Math.cos(3.142), y: h * 0.33, z: r * Math.sin(3.142) },    // Base 180°
                        { x: r * Math.cos(5.236), y: h * 0.33, z: r * Math.sin(5.236) }     // Base 300°
                    ];

                    // Aristas de cada tetraedro (6 aristas por tetraedro)
                    const edgePairs = [[0, 1], [0, 2], [0, 3], [1, 2], [2, 3], [3, 1]];

                    // Caras de cada tetraedro (4 caras triangulares)
                    const faces = [[0, 1, 2], [0, 2, 3], [0, 3, 1], [1, 3, 2]];

                    // Función: punto en arista 3D
                    const pointOnEdge3D = (v1, v2, thickness) => {
                        const t = Math.random();
                        return {
                            x: v1.x + (v2.x - v1.x) * t + (Math.random() - 0.5) * thickness,
                            y: v1.y + (v2.y - v1.y) * t + (Math.random() - 0.5) * thickness,
                            z: v1.z + (v2.z - v1.z) * t + (Math.random() - 0.5) * thickness,
                            size: 0.5 + Math.random() * 0.4
                        };
                    };

                    // Función: punto dentro de cara triangular (para el relleno brillante)
                    const pointInFace3D = (v0, v1, v2) => {
                        // Coordenadas baricéntricas aleatorias
                        let a = Math.random();
                        let b = Math.random();
                        if (a + b > 1) { a = 1 - a; b = 1 - b; }
                        const c = 1 - a - b;
                        return {
                            x: v0.x * a + v1.x * b + v2.x * c,
                            y: v0.y * a + v1.y * b + v2.y * c,
                            z: v0.z * a + v1.z * b + v2.z * c,
                            size: 0.2 + Math.random() * 0.3
                        };
                    };

                    // Función: línea radial desde centro de cara hacia vértice
                    const pointOnRadial3D = (center, vertex, density) => {
                        const t = Math.random();
                        return {
                            x: center.x + (vertex.x - center.x) * t,
                            y: center.y + (vertex.y - center.y) * t,
                            z: center.z + (vertex.z - center.z) * t,
                            size: 0.15 + Math.random() * 0.2
                        };
                    };

                    // =============================================
                    // DISTRIBUCIÓN DE PARTÍCULAS
                    // 30% aristas tetraedro UP (más definición)
                    // 30% aristas tetraedro DOWN (más definición)
                    // 8% relleno caras UP (menos denso)
                    // 8% relleno caras DOWN (menos denso)
                    // 24% líneas radiales internas (más visibles)
                    // =============================================

                    for (let i = 0; i < count; i++) {
                        const r = Math.random();
                        let p;

                        if (r < 0.30) {
                            // Aristas del tetraedro SUPERIOR
                            const pair = edgePairs[Math.floor(Math.random() * edgePairs.length)];
                            p = pointOnEdge3D(upVerts[pair[0]], upVerts[pair[1]], 0.04);
                            p.type = 'tetraUp';
                            p.subType = 'edge';
                            p.color = 'gold';
                        } else if (r < 0.60) {
                            // Aristas del tetraedro INFERIOR
                            const pair = edgePairs[Math.floor(Math.random() * edgePairs.length)];
                            p = pointOnEdge3D(downVerts[pair[0]], downVerts[pair[1]], 0.04);
                            p.type = 'tetraDown';
                            p.subType = 'edge';
                            p.color = 'gold';
                        } else if (r < 0.68) {
                            // Relleno de caras tetraedro SUPERIOR (muy sutil)
                            const face = faces[Math.floor(Math.random() * faces.length)];
                            p = pointInFace3D(upVerts[face[0]], upVerts[face[1]], upVerts[face[2]]);
                            p.size = 0.1 + Math.random() * 0.15; // Más pequeñas
                            p.type = 'tetraUp';
                            p.subType = 'face';
                            p.color = 'gold';
                        } else if (r < 0.76) {
                            // Relleno de caras tetraedro INFERIOR (muy sutil)
                            const face = faces[Math.floor(Math.random() * faces.length)];
                            p = pointInFace3D(downVerts[face[0]], downVerts[face[1]], downVerts[face[2]]);
                            p.size = 0.1 + Math.random() * 0.15; // Más pequeñas
                            p.type = 'tetraDown';
                            p.subType = 'face';
                            p.color = 'gold';
                        } else {
                            // Líneas radiales internas (desde centro de cara hacia vértices)
                            const verts = Math.random() < 0.5 ? upVerts : downVerts;
                            const tetraType = verts === upVerts ? 'tetraUp' : 'tetraDown';
                            const face = faces[Math.floor(Math.random() * faces.length)];
                            const center = {
                                x: (verts[face[0]].x + verts[face[1]].x + verts[face[2]].x) / 3,
                                y: (verts[face[0]].y + verts[face[1]].y + verts[face[2]].y) / 3,
                                z: (verts[face[0]].z + verts[face[1]].z + verts[face[2]].z) / 3
                            };
                            const vertex = verts[face[Math.floor(Math.random() * 3)]];
                            p = pointOnRadial3D(center, vertex, 12);
                            p.type = tetraType;
                            p.subType = 'radial';
                            p.color = 'gold';
                        }

                        points.push(p);
                    }

                    return points;
                },

                // FLOR DE LA VIDA - Diseño clásico 19 círculos con CAPAS
                flowerOfLife(count) {
                    const points = [];
                    const r = 1.6; // Radio de cada círculo

                    // 19 centros con sus capas: {pos, layer}
                    const centers = [];
                    centers.push({ pos: [0, 0], layer: 0 }); // Centro - Capa 0

                    // Primera capa: 6 círculos (Semilla de la Vida) - Capa 1
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2;
                        centers.push({ pos: [Math.cos(a) * r, Math.sin(a) * r], layer: 1 });
                    }
                    // Segunda capa: 6 círculos en los vértices - Capa 2
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
                        centers.push({ pos: [Math.cos(a) * r * Math.sqrt(3), Math.sin(a) * r * Math.sqrt(3)], layer: 2 });
                    }
                    // Tercera capa: 6 círculos externos - Capa 3
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2;
                        centers.push({ pos: [Math.cos(a) * r * 2, Math.sin(a) * r * 2], layer: 3 });
                    }

                    for (let i = 0; i < count; i++) {
                        const centerData = centers[Math.floor(Math.random() * centers.length)];
                        const center = centerData.pos;
                        const layer = centerData.layer;
                        const angle = Math.random() * Math.PI * 2;
                        const radius = r * (0.98 + Math.random() * 0.04);
                        points.push({
                            x: center[0] + Math.cos(angle) * radius,
                            y: center[1] + Math.sin(angle) * radius,
                            z: (Math.random() - 0.5) * 0.1,
                            size: 0.5 + Math.random() * 0.4,
                            subType: 'edge',
                            layer: layer // Guardamos la capa
                        });
                    }
                    return points;
                },

                // TORUS - Campo toroidal vórtex
                torus(count) {
                    const points = [];
                    const R = 3.0, r = 1.15;

                    // Inclinación baked
                    const tiltX = -0.85, tiltZ = 0.17;
                    const cosTX = Math.cos(tiltX), sinTX = Math.sin(tiltX);
                    const cosTZ = Math.cos(tiltZ), sinTZ = Math.sin(tiltZ);
                    function tilt(bx, by, bz) {
                        const ry = by * cosTX - bz * sinTX;
                        const rz = by * sinTX + bz * cosTX;
                        return { x: bx * cosTZ - ry * sinTZ, y: bx * sinTZ + ry * cosTZ, z: rz };
                    }

                    // === 1. SUPERFICIE (7%) — silueta exterior del torus ===
                    const surfaceCount = Math.floor(count * 0.07);
                    for (let i = 0; i < surfaceCount; i++) {
                        const phi = Math.random() * Math.PI * 2;
                        const theta = Math.random() * Math.PI * 2;
                        const rVar = r * (0.98 + Math.random() * 0.04);
                        const bx = (R + rVar * Math.cos(theta)) * Math.cos(phi);
                        const by = rVar * Math.sin(theta);
                        const bz = (R + rVar * Math.cos(theta)) * Math.sin(phi);
                        const p = tilt(bx, by, bz);
                        points.push({
                            x: p.x, y: p.y, z: p.z,
                            size: 0.18 + Math.random() * 0.15,
                            type: 'torus', subType: 'surface',
                            torusFlow: { phi, theta }
                        });
                    }

                    // === 2. ESPIRALES (8%) — 3 líneas de energía limpias ===
                    const spiralCount = Math.floor(count * 0.08);
                    const numSpirals = 3;
                    const ptsPerSpiral = Math.floor(spiralCount / numSpirals);
                    for (let s = 0; s < numSpirals; s++) {
                        const spiralOffset = (s / numSpirals) * Math.PI * 2;
                        for (let j = 0; j < ptsPerSpiral; j++) {
                            const t = j / ptsPerSpiral;
                            const phi = t * Math.PI * 2 + spiralOffset;
                            const theta = t * Math.PI * 2 * 3;
                            const bx = (R + r * Math.cos(theta)) * Math.cos(phi);
                            const by = r * Math.sin(theta);
                            const bz = (R + r * Math.cos(theta)) * Math.sin(phi);
                            const p = tilt(bx, by, bz);
                            points.push({
                                x: p.x, y: p.y, z: p.z,
                                size: 0.35 + Math.random() * 0.15,
                                type: 'torus', subType: 'spiral',
                                torusFlow: { phi, theta }
                            });
                        }
                    }

                    // === 3. ANILLOS (5%) — 8 anillos bien definidos ===
                    const ringCount = Math.floor(count * 0.05);
                    const numRings = 8;
                    const ptsPerRing = Math.floor(ringCount / numRings);
                    for (let m = 0; m < numRings; m++) {
                        const theta = (m / numRings) * Math.PI * 2;
                        for (let j = 0; j < ptsPerRing; j++) {
                            const phi = (j / ptsPerRing) * Math.PI * 2;
                            const bx = (R + r * Math.cos(theta)) * Math.cos(phi);
                            const by = r * Math.sin(theta);
                            const bz = (R + r * Math.cos(theta)) * Math.sin(phi);
                            const p = tilt(bx, by, bz);
                            points.push({
                                x: p.x, y: p.y, z: p.z,
                                size: 0.45 + Math.random() * 0.2,
                                type: 'torus', subType: 'ring',
                                torusFlow: { phi, theta }
                            });
                        }
                    }

                    // === 4. MERIDIANOS (4%) — líneas alrededor del tubo para definir 3D ===
                    const meridianCount = Math.floor(count * 0.04);
                    const numMeridians = 10;
                    const ptsPerMeridian = Math.floor(meridianCount / numMeridians);
                    for (let m = 0; m < numMeridians; m++) {
                        const phi = (m / numMeridians) * Math.PI * 2;
                        for (let j = 0; j < ptsPerMeridian; j++) {
                            const theta = (j / ptsPerMeridian) * Math.PI * 2;
                            const bx = (R + r * Math.cos(theta)) * Math.cos(phi);
                            const by = r * Math.sin(theta);
                            const bz = (R + r * Math.cos(theta)) * Math.sin(phi);
                            const p = tilt(bx, by, bz);
                            points.push({
                                x: p.x, y: p.y, z: p.z,
                                size: 0.3 + Math.random() * 0.15,
                                type: 'torus', subType: 'meridian',
                                torusFlow: { phi, theta }
                            });
                        }
                    }

                    // === 5. VÓRTEX INTERIOR (5%) — flujo concentrado por el agujero ===
                    const innerCount = Math.floor(count * 0.05);
                    for (let i = 0; i < innerCount; i++) {
                        const phi = Math.random() * Math.PI * 2;
                        const theta = Math.PI + (Math.random() - 0.5) * 1.0;
                        const bx = (R + r * Math.cos(theta)) * Math.cos(phi);
                        const by = r * Math.sin(theta);
                        const bz = (R + r * Math.cos(theta)) * Math.sin(phi);
                        const p = tilt(bx, by, bz);
                        points.push({
                            x: p.x, y: p.y, z: p.z,
                            size: 0.55 + Math.random() * 0.3,
                            type: 'torus', subType: 'inner',
                            torusFlow: { phi, theta }
                        });

                    const centerCount = Math.floor(count * 0.03);
                    for (let i = 0; i < centerCount; i++) {

                        const coreR = 0.1 + Math.random() * 0.2;

                        const by = coreR * Math.sin(theta);
                        const bz = (R + coreR * Math.cos(theta)) * Math.sin(phi);
                        const p = tilt(bx, by, bz);
                        points.push({
                            x: p.x, y: p.y, z: p.z,
                            size: 0.4 + Math.random() * 0.35,
                            type: 'torus', subType: 'center',
                            torusFlow: { phi, theta }
                        });
                    }

                    // === 7. POLVO AMBIENTE — relleno casi invisible ===
                    const dustCount = count - points.length;
                    for (let i = 0; i < dustCount; i++) {
                        const phi = Math.random() * Math.PI * 2;
                        const theta = Math.random() * Math.PI * 2;
                        const rVar = r * (0.75 + Math.random() * 0.5);
                        const bx = (R + rVar * Math.cos(theta)) * Math.cos(phi);
                        const by = rVar * Math.sin(theta);
                        const bz = (R + rVar * Math.cos(theta)) * Math.sin(phi);
                        const p = tilt(bx, by, bz);
                        points.push({
                            x: p.x, y: p.y, z: p.z,
                            size: 0.02 + Math.random() * 0.03,
                            type: 'torus', subType: 'dust',
                            torusFlow: { phi, theta }
                        });
                    }

                    return points;
                }
            };

            function createSymbolBuffer(points, count, offset) {
                const positions = new Float32Array(count * 3);
                const sizes = new Float32Array(count);
                const types = new Array(count);
                const subTypes = new Array(count);
                const colors = new Array(count);
                const orbitalData = new Array(count);
                const layers = new Array(count); // NUEVO: capas para Flor de la Vida
                for (let i = 0; i < count; i++) {

                    positions[i3 + 1] = p.y + offset.y;
                    positions[i3 + 2] = p.z + offset.z;

                    types[i] = p.type || 'inner';
                    subTypes[i] = p.subType || null;
                    colors[i] = p.color || 'gold';

                            baseAngle: p.baseAngle || 0,
                            baseRadius: p.baseRadius || 0,
                            baseZ: p.z
                        };
