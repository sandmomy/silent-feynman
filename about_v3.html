        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        .scroll-container {
            height: 100vh;
            position: relative;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 300;
            color: var(--accent-light);
            text-decoration: none;
            letter-spacing: 0.08em;
        }

        .nav-links {
            display: flex;
            gap: 36px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-light);
        }

        /* Progress bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent), var(--accent-light));
            width: 0%;
            z-index: 1000;
            box-shadow: 0 0 15px var(--accent);
        }

        /* Section indicators */
        .section-indicator {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 100;
        }

        .indicator-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            border: 1px solid rgba(184, 150, 12, 0.2);
            background: transparent;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .indicator-dot:hover {
            border-color: var(--accent);
        }

        .indicator-dot.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: none;
        }

        /* Page counter */
        .page-counter {
            position: fixed;
            bottom: 40px;
            left: 40px;
            font-family: 'Cormorant Garamond', serif;
            z-index: 100;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .page-counter__current {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--accent-light);
            text-shadow: 0 0 20px rgba(184, 150, 12, 0.3);
        }

        .page-counter__total {
            font-size: 1rem;
            color: rgba(184, 150, 12, 0.5);
        }

        /* Section name */
        .section-name {
            position: fixed;
            top: 50%;
            left: 40px;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: left center;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.25);
            z-index: 100;
            transition: color 0.5s ease;
        }

        /* Scroll hint */
        .scroll-hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0.5;
            transition: opacity 0.4s ease;
        }

        .scroll-hint span {
            font-size: 0.55rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }

        .scroll-hint__line {
            width: 1px;
            height: 40px;
            background: linear-gradient(180deg, var(--accent), transparent);
            animation: scrollPulse 2s ease-in-out infinite;
        }

        @keyframes scrollPulse {

            0%,
            100% {
                opacity: 1;
                height: 40px;
            }

            50% {
                opacity: 0.3;
                height: 25px;
            }
        }

        /* Corner accents */
        .corner-accent {
            position: fixed;
            width: 60px;
            height: 60px;
            z-index: 100;
            pointer-events: none;
        }

        .corner-accent--tl {
            top: 20px;
            left: 20px;
            border-left: 1px solid rgba(184, 150, 12, 0.15);
            border-top: 1px solid rgba(184, 150, 12, 0.15);
        }

        .corner-accent--br {
            bottom: 20px;
            right: 20px;
            border-right: 1px solid rgba(184, 150, 12, 0.15);
            border-bottom: 1px solid rgba(184, 150, 12, 0.15);
        }

        /* Responsive */
        @media (max-width: 992px) {
            body::before {
                background-size: auto 100vh;
            }

            .nav-links {
                display: none;
            }

            nav {
                padding: 16px;
            }

            .section-indicator {
                right: 10px;
                gap: 10px;
            }

            .indicator-dot {
                width: 6px;
                height: 6px;
            }

            .page-counter {
                display: none;
            }

            .section-name {
                display: none;
            }

            .corner-accent {
                width: 25px;
                height: 25px;
            }

            .scroll-hint {
                bottom: 20px;
            }

        }
    </style>
</head>

            const SymbolGenerators = {

                // MERKABA - Star Tetrahedron 3D con geometría correcta

                merkaba(count) {

                flowerOfLife(count) {

                // TORUS — MANUS EDITION

                torus(count) {
                    const points = [];
                    const R = 3.0, r = 1.15;

                    const cosTX = Math.cos(tiltX), sinTX = Math.sin(tiltX);
                    const cosTZ = Math.cos(tiltZ), sinTZ = Math.sin(tiltZ);
                    function tilt(bx, by, bz) {
                        const ry = by * cosTX - bz * sinTX;
                        const rz = by * sinTX + bz * cosTX;
                        return { x: bx * cosTZ - ry * sinTZ, y: bx * sinTZ + ry * cosTZ, z: rz };
