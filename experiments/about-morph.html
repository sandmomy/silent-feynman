<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugene Mierak | The Journey</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Jost:wght@300;400;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #020203;
            color: #fff;
            font-family: 'Jost', sans-serif;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .scroll-height {
            height: 1200vh;
            position: relative;
            z-index: 0;
        }

        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #d4af37;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #fff;
            opacity: 0.7;
            text-decoration: none;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 1;
            color: #d4af37;
        }

        .chapter-indicator {
            position: fixed;
            left: 40px;
            bottom: 40px;
            font-family: 'Cinzel', serif;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            letter-spacing: 3px;
        }

        /* LARGE BACKGROUND TITLE */
        .scene-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Cinzel', serif;
            font-size: 16vw;
            color: rgba(255, 255, 255, 0.03);
            white-space: nowrap;
            letter-spacing: 1.5vw;
            pointer-events: none;
            transition: opacity 1s;
        }

        #debug-console {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: rgba(20, 0, 0, 0.9);
            color: #ff5555;
            overflow-y: scroll;
            z-index: 9999;
            font-family: monospace;
            padding: 10px;
            display: none;
            border-top: 2px solid red;
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020203;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            font-family: 'Cinzel';
            transition: opacity 0.8s;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="debug-console">DEBUG:<br></div>
    <div class="loader" id="loader">INITIALIZING EXPERIENCE...</div>
    <div id="canvas-container"></div>

    <div class="ui-layer">
        <nav>
            <a href="#" class="logo">EUGENE MIERAK</a>
            <div class="nav-links">
                <a href="#">About</a>
                <a href="#">Process</a>
                <a href="#">Contact</a>
            </div>
        </nav>
        <div class="chapter-indicator"><span id="chapterName">I. ORIGIN</span></div>
        <div class="scene-title" id="sceneTitle">CHAOS</div>
    </div>

    <div class="scroll-height"></div>

    <script>
        function logError(msg) {
            const el = document.getElementById('debug-console');
            el.style.display = 'block';
            el.innerHTML += `> ${msg}<br>`;
            console.error(msg);
        }
        window.onerror = function (msg, source, lineno, colno, error) {
            logError(`${msg} (${lineno})`);
        };
    </script>

    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size;
        attribute vec3 pos0; attribute vec3 pos1; attribute vec3 pos2; attribute vec3 pos3; attribute vec3 pos4;
        uniform float uScroll; uniform float uTime; uniform float uPixelRatio;
        varying vec3 vColor; varying float vAlpha;

        void main() {
            float t = uScroll;
            t = clamp(t, 0.0, 4.0);
            
            vec3 finalPos = vec3(0.0);
            vec3 color = vec3(1.0);
            
            // Colors per stage
            vec3 c0 = vec3(0.6, 0.6, 0.7); // Grey/Blue
            vec3 c1 = vec3(0.2, 0.6, 1.0); // Cyan
            vec3 c2 = vec3(1.0, 0.8, 0.2); // Gold
            vec3 c3 = vec3(0.0, 1.0, 0.8); // Teal
            vec3 c4 = vec3(1.0, 0.9, 1.0); // White/Pink

            if (t < 1.0) {
                float f = smoothstep(0.0, 1.0, t);
                finalPos = mix(pos0, pos1, f);
                color = mix(c0, c1, f);
            } else if (t < 2.0) {
                float f = smoothstep(0.0, 1.0, t - 1.0);
                finalPos = mix(pos1, pos2, f);
                color = mix(c1, c2, f);
            } else if (t < 3.0) {
                float f = smoothstep(0.0, 1.0, t - 2.0);
                finalPos = mix(pos2, pos3, f);
                color = mix(c2, c3, f);
            } else {
                float f = smoothstep(0.0, 1.0, t - 3.0);
                finalPos = mix(pos3, pos4, f);
                color = mix(c3, c4, f);
            }

            // Subtle noise movement
            float wave = sin(finalPos.y * 0.05 + uTime) * 0.5;
            finalPos.x += wave;

            vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = size * (400.0 / -mvPosition.z) * uPixelRatio;
            
            vColor = color;
            vAlpha = 1.0; 
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentshader">
        varying vec3 vColor; varying float vAlpha;
        void main() {
            vec2 c = gl_PointCoord - 0.5;
            float dist = length(c);
            if (dist > 0.5) discard;
            float a = 1.0 - smoothstep(0.3, 0.5, dist);
            gl_FragColor = vec4(vColor, a * vAlpha);
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        try {
            gsap.registerPlugin(ScrollTrigger);

            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020203, 0.003); // Deep space fog
            scene.background = new THREE.Color(0x020203);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 100);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // --- CONSTANTS ---
            const Z_SPACING = 200; // Distance between stations
            const stations = [0, -Z_SPACING, -Z_SPACING * 2, -Z_SPACING * 3, -Z_SPACING * 4];

            // --- CARDS ---
            function createTextTexture(content) {
                const canvas = document.createElement('canvas');
                canvas.width = 800; canvas.height = 600;
                const ctx = canvas.getContext('2d');

                // Solid Deep Card
                ctx.fillStyle = '#0b0c10';
                ctx.fillRect(0, 0, 800, 600);

                // Gold Border
                ctx.strokeStyle = '#c5a059';
                ctx.lineWidth = 12;
                ctx.strokeRect(0, 0, 800, 600);

                // Top Detail
                ctx.fillStyle = '#c5a059';
                ctx.fillRect(0, 0, 800, 10);

                // Content
                ctx.textAlign = 'left';
                ctx.fillStyle = '#c5a059';
                ctx.font = '700 24px Jost';
                ctx.fillText(content.label, 60, 100);

                ctx.fillStyle = '#ffffff';
                ctx.font = '400 85px Cinzel';
                let y = 220;
                content.title.split('\n').forEach((l) => { ctx.fillText(l, 60, y); y += 90; });

                ctx.fillStyle = '#a0a0a0';
                ctx.font = '400 32px Jost';
                y += 60;
                content.body.split('\n').forEach((l) => { ctx.fillText(l, 60, y); y += 45; });

                return new THREE.CanvasTexture(canvas);
            }

            const cardsData = [
                { label: '01. ORIGIN', title: 'Eugene\nMierak', body: 'Frequency practitioner\nspecializing in alignment.' },
                { label: '02. FORM', title: 'Sacred\nStructure', body: 'Building evolutionary\nsystems via Geometry.' },
                { label: '03. FLOW', title: 'Torus\nResonance', body: 'Cultivating infinite\nenergy flow states.' },
                { label: '04. SCALE', title: 'Global\nWeb', body: 'Interconnected networks\nof conscious change.' },
                { label: '05. IMPACT', title: 'Coherent\nCore', body: 'Focused intention for\nplanetary regeneration.' }
            ];

            const cards = [];
            cardsData.forEach((d, i) => {
                const tex = createTextTexture(d);
                const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
                const geo = new THREE.PlaneGeometry(32, 24);
                const mesh = new THREE.Mesh(geo, mat);

                // Layout: RIGHT side (X=30)
                // Z Position: At the station, but slightly forward (+20) so we see it well
                mesh.position.set(30, 0, stations[i] + 20);

                scene.add(mesh);
                cards.push(mesh);
            });

            // --- PARTICLES ---
            const count = 15000;
            const geometry = new THREE.BufferGeometry();

            // Allocate buffers
            const buffers = [
                new Float32Array(count * 3), new Float32Array(count * 3),
                new Float32Array(count * 3), new Float32Array(count * 3), new Float32Array(count * 3)
            ];
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;

                // Layout: LEFT side (X=-25)
                // Z Position: Centered on current STATION

                // 0. CUBE (Origin)
                const s = 35;
                buffers[0][i3] = (Math.random() - 0.5) * s - 25;
                buffers[0][i3 + 1] = (Math.random() - 0.5) * s;
                buffers[0][i3 + 2] = (Math.random() - 0.5) * s + stations[0];

                // 1. HELIX (Structure)
                const h = (Math.random() - 0.5) * 60; const a = (h + 30) * 0.3; const r = 12;
                buffers[1][i3] = Math.cos(a) * r - 25;
                buffers[1][i3 + 1] = h;
                buffers[1][i3 + 2] = Math.sin(a) * r + stations[1];

                // 2. TORUS (Resonance)
                const u = Math.random() * Math.PI * 2; const v = Math.random() * Math.PI * 2; const R = 18, rT = 6;
                buffers[2][i3] = ((R + rT * Math.cos(v)) * Math.cos(u)) - 25;
                buffers[2][i3 + 1] = ((R + rT * Math.cos(v)) * Math.sin(u));
                buffers[2][i3 + 2] = rT * Math.sin(v) + stations[2];

                // 3. SPHERE (Global)
                const phi = Math.acos(-1 + (2 * i) / count); const theta = Math.sqrt(count * Math.PI) * phi; const rad = 25;
                buffers[3][i3] = (rad * Math.cos(theta) * Math.sin(phi)) - 25;
                buffers[3][i3 + 1] = rad * Math.sin(theta) * Math.sin(phi);
                buffers[3][i3 + 2] = rad * Math.cos(phi) + stations[3];

                // 4. CORE (Impact)
                const rE = Math.pow(Math.random(), 3) * 50;
                const rx = (Math.random() - 0.5); const ry = (Math.random() - 0.5); const rz = (Math.random() - 0.5);
                const len = Math.sqrt(rx * rx + ry * ry + rz * rz) || 1;
                buffers[4][i3] = ((rx / len) * rE) - 25;
                buffers[4][i3 + 1] = (ry / len) * rE;
                buffers[4][i3 + 2] = (rz / len) * rE + stations[4];

                sizes[i] = Math.random() * 1.5 + 0.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(buffers[0], 3)); // initial
            geometry.setAttribute('pos0', new THREE.BufferAttribute(buffers[0], 3));
            geometry.setAttribute('pos1', new THREE.BufferAttribute(buffers[1], 3));
            geometry.setAttribute('pos2', new THREE.BufferAttribute(buffers[2], 3));
            geometry.setAttribute('pos3', new THREE.BufferAttribute(buffers[3], 3));
            geometry.setAttribute('pos4', new THREE.BufferAttribute(buffers[4], 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 }, uScroll: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
            });
            const points = new THREE.Points(geometry, material);
            scene.add(points);

            // --- STARFIELD (For Speed Sensation) ---
            const starGeo = new THREE.BufferGeometry();
            const sPos = [];
            for (let i = 0; i < 4000; i++) {
                sPos.push((Math.random() - 0.5) * 800);
                sPos.push((Math.random() - 0.5) * 800);
                sPos.push((Math.random() - 0.5) * 1500 - 500); // Varied depth
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0x555555, size: 0.8 });
            const starField = new THREE.Points(starGeo, starMat);
            scene.add(starField);


            // --- ANIMATION / SCROLL ---
            const progress = { val: 0 };

            gsap.to(progress, {
                val: 4, ease: "none",
                scrollTrigger: {
                    trigger: ".scroll-height", start: "top top", end: "bottom bottom", scrub: 0.5,
                    onUpdate: (self) => {
                        const t = self.progress * 4;
                        material.uniforms.uScroll.value = t;

                        // UI Titles
                        const idx = Math.round(t);
                        const titles = ['CHAOS', 'STRUCTURE', 'RESONANCE', 'GLOBAL', 'IMPACT'];
                        if (document.getElementById('sceneTitle')) {
                            const el = document.getElementById('sceneTitle');
                            el.innerText = titles[idx] || "";
                            // Fade title if simple distance
                            const dist = Math.abs(t - idx);
                            el.style.opacity = (dist < 0.4) ? 1.0 - (dist / 0.4) : 0;
                        }
                        if (document.getElementById('progressFill')) document.getElementById('progressFill').style.height = (self.progress * 100) + '%';

                        // FLY CAMERA
                        // We trail behind the current morph target
                        // target Z = interpolated station Z
                        // We want cam Z = target Z + 100
                        const currentStationZ = -t * Z_SPACING;
                        camera.position.z = currentStationZ + 100;

                        // Fade Cards Logic
                        cards.forEach((c, i) => {
                            c.lookAt(camera.position);
                            const dist = c.position.distanceTo(camera.position);
                            let op = 0;
                            // Visible when approaching (120) and passing (50)
                            // Peak visibility around 70-80 units away
                            if (dist < 140 && dist > 40) {
                                // Simple window
                                op = 1;
                                if (dist > 100) op = 1.0 - (dist - 100) / 40; // Fade in
                                if (dist < 60) op = (dist - 40) / 20; // Fade out quickly
                            }
                            c.material.opacity = op;
                            // Scale bounce
                            const s = 1 + op * 0.05;
                            c.scale.set(s, s, s);
                        });
                    }
                }
            });

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const time = clock.getElapsedTime();
                material.uniforms.uTime.value = time;

                // Slow rotation
                points.rotation.z = time * 0.03;

                // Move stars slowly to feel like drift
                starField.position.z += 0.2;
                if (starField.position.z > 200) starField.position.z = -200;

                renderer.render(scene, camera);
            }
            animate();

            setTimeout(() => document.getElementById('loader').classList.add('hidden'), 500);

        } catch (e) {
            logError(e.message);
        }
    </script>
</body>

</html>
