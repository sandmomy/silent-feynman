<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugene Mierak | About</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050505;
            --gold: #c9a227;
            --gold-light: #e8d48a;
            --gold-dark: #8b6914;

            /* Section color personalities */
            --section-1: #8b6914;    /* Earth/Root - deep amber */
            --section-2: #c9a227;    /* Expansion - pure gold */
            --section-3: #e8d48a;    /* Connection - bright gold */
            --section-4: #4a9b9b;    /* Global - teal/gold fusion */
            --section-5: #f4e9c8;    /* Transcendence - white gold */
        }

        html,
        body {
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        /* Eugene's image as background - FIRST LAYER */
        .eugene-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/meditation-bg.png') center/cover;
            z-index: 1;
            opacity: 0.7;
            filter: brightness(0.55) contrast(1.05);
        }

        /* Dark overlay on top of image */
        .dark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Dynamic section color overlay */
        .section-color-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transition: background 1.5s ease-out;
            mix-blend-mode: overlay;
        }

        /* Section name indicator */
        .section-name {
            position: fixed;
            top: 50%;
            left: 40px;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: left center;
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            z-index: 100;
            transition: color 1s ease, opacity 0.5s ease;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 3;
        }

        .scroll-container {
            height: 600vh;
            position: relative;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 0.1em;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light));
            width: 0%;
            z-index: 1000;
            box-shadow: 0 0 20px var(--gold);
        }

        .section-indicator {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(201, 162, 39, 0.4);
            background: transparent;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .indicator-dot:hover {
            border-color: var(--gold);
            transform: scale(1.3);
        }

        .indicator-dot.active {
            background: var(--gold);
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(201, 162, 39, 0.6);
            transform: scale(1.4);
            transition: all 0.5s ease, background 1s ease, border-color 1s ease, box-shadow 1s ease;
        }

        /* Section-specific dot colors */
        .indicator-dot.active[data-index="0"] {
            background: var(--section-1);
            border-color: var(--section-1);
            box-shadow: 0 0 20px rgba(139, 105, 20, 0.7);
        }
        .indicator-dot.active[data-index="1"] {
            background: var(--section-2);
            border-color: var(--section-2);
            box-shadow: 0 0 20px rgba(201, 162, 39, 0.7);
        }
        .indicator-dot.active[data-index="2"] {
            background: var(--section-3);
            border-color: var(--section-3);
            box-shadow: 0 0 20px rgba(232, 212, 138, 0.7);
        }
        .indicator-dot.active[data-index="3"] {
            background: var(--section-4);
            border-color: var(--section-4);
            box-shadow: 0 0 20px rgba(74, 155, 155, 0.7);
        }
        .indicator-dot.active[data-index="4"] {
            background: var(--section-5);
            border-color: var(--section-5);
            box-shadow: 0 0 25px rgba(244, 233, 200, 0.8);
        }

        /* Page counter */
        .page-counter {
            position: fixed;
            bottom: 40px;
            left: 40px;
            font-family: 'Cormorant Garamond', serif;
            z-index: 100;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .page-counter__current {
            font-size: 3rem;
            font-weight: 300;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(201, 162, 39, 0.5);
            transition: color 1s ease, text-shadow 1s ease;
        }

        .page-counter__total {
            font-size: 1.2rem;
            color: rgba(201, 162, 39, 0.5);
        }

        /* Scroll hint */
        .scroll-hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0.6;
            transition: opacity 0.4s ease;
        }

        .scroll-hint span {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
        }

        .scroll-hint__line {
            width: 1px;
            height: 50px;
            background: linear-gradient(180deg, var(--gold), transparent);
            animation: scrollPulse 2s ease-in-out infinite;
        }

        @keyframes scrollPulse {
            0%, 100% { opacity: 1; height: 50px; }
            50% { opacity: 0.3; height: 30px; }
        }

        /* Corner accents */
        .corner-accent {
            position: fixed;
            width: 80px;
            height: 80px;
            z-index: 100;
            pointer-events: none;
        }

        .corner-accent--tl {
            top: 20px;
            left: 20px;
            border-left: 1px solid rgba(201, 162, 39, 0.3);
            border-top: 1px solid rgba(201, 162, 39, 0.3);
        }

        .corner-accent--br {
            bottom: 20px;
            right: 20px;
            border-right: 1px solid rgba(201, 162, 39, 0.3);
            border-bottom: 1px solid rgba(201, 162, 39, 0.3);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            nav {
                padding: 20px;
            }

            .section-indicator {
                right: 15px;
            }

            .page-counter {
                left: 20px;
                bottom: 20px;
            }

            .corner-accent {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

<body>
    <!-- Eugene background -->
    <div class="eugene-bg"></div>

    <!-- Dark overlay -->
    <div class="dark-overlay"></div>

    <!-- Dynamic color overlay for section personality -->
    <div class="section-color-overlay" id="sectionOverlay"></div>

    <!-- Progress bar -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- Corner accents -->
    <div class="corner-accent corner-accent--tl"></div>
    <div class="corner-accent corner-accent--br"></div>

    <!-- Navigation -->
    <nav>
        <a href="index.html" class="logo">Eugene Mierak</a>
        <div class="nav-links">
            <a href="#">About</a>
            <a href="#">Work</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <!-- Section indicators -->
    <div class="section-indicator" id="sectionIndicator">
        <div class="indicator-dot active" data-index="0"></div>
        <div class="indicator-dot" data-index="1"></div>
        <div class="indicator-dot" data-index="2"></div>
        <div class="indicator-dot" data-index="3"></div>
        <div class="indicator-dot" data-index="4"></div>
    </div>

    <!-- Page counter -->
    <div class="page-counter">
        <span class="page-counter__current" id="pageNum">01</span>
        <span class="page-counter__total">/ 05</span>
    </div>

    <!-- Section energy name -->
    <div class="section-name" id="sectionName">ROOT</div>

    <!-- Scroll hint -->
    <div class="scroll-hint">
        <span>Scroll</span>
        <div class="scroll-hint__line"></div>
    </div>

    <!-- Three.js container -->
    <div id="canvas-container"></div>

    <!-- Scroll container -->
    <div class="scroll-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        // Wait for fonts to load
        document.fonts.ready.then(() => {
            init();
        });

        function init() {
        gsap.registerPlugin(ScrollTrigger);

        const container = document.getElementById('canvas-container');
        const progressBar = document.getElementById('progressBar');
        const dots = document.querySelectorAll('.indicator-dot');
        const pageNum = document.getElementById('pageNum');

        // Scene
        const scene = new THREE.Scene();
        scene.background = null; // Transparent to show Eugene bg
        scene.fog = new THREE.FogExp2(0x000000, 0.004); // Lighter fog

        // Camera
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);
        container.appendChild(renderer.domElement);

        // Gold color
        const goldColor = new THREE.Color(0xc9a227);
        const goldLight = new THREE.Color(0xe8d48a);

        // Section personalities - each has unique energy
        const sectionPersonalities = [
            {
                name: 'ROOT',
                primary: new THREE.Color(0x8b6914),      // Deep amber
                secondary: new THREE.Color(0x5c4a0f),    // Earth brown
                accent: new THREE.Color(0xc9a227),
                fog: new THREE.Color(0x0a0705),          // Warm black
                particleSpeed: 0.0002,
                geometryPulse: 0.5,
                bgOverlay: 'rgba(139, 105, 20, 0.08)'
            },
            {
                name: 'EXPANSION',
                primary: new THREE.Color(0xc9a227),      // Pure gold
                secondary: new THREE.Color(0xe8d48a),    // Light gold
                accent: new THREE.Color(0xffd700),
                fog: new THREE.Color(0x080604),
                particleSpeed: 0.0004,
                geometryPulse: 0.8,
                bgOverlay: 'rgba(201, 162, 39, 0.06)'
            },
            {
                name: 'CONNECTION',
                primary: new THREE.Color(0xe8d48a),      // Bright gold
                secondary: new THREE.Color(0xfff4d6),    // Cream gold
                accent: new THREE.Color(0xffeaa7),
                fog: new THREE.Color(0x0a0806),
                particleSpeed: 0.0006,
                geometryPulse: 1.0,
                bgOverlay: 'rgba(232, 212, 138, 0.05)'
            },
            {
                name: 'GLOBAL',
                primary: new THREE.Color(0x4a9b9b),      // Teal
                secondary: new THREE.Color(0xc9a227),    // Gold accent
                accent: new THREE.Color(0x7ecfcf),       // Light teal
                fog: new THREE.Color(0x050808),          // Cool black
                particleSpeed: 0.0005,
                geometryPulse: 0.9,
                bgOverlay: 'rgba(74, 155, 155, 0.08)'
            },
            {
                name: 'TRANSCENDENCE',
                primary: new THREE.Color(0xf4e9c8),      // White gold
                secondary: new THREE.Color(0xffffff),    // Pure white
                accent: new THREE.Color(0xfffef5),
                fog: new THREE.Color(0x0c0a08),          // Subtle warm
                particleSpeed: 0.0003,
                geometryPulse: 1.2,
                bgOverlay: 'rgba(244, 233, 200, 0.04)'
            }
        ];

        let currentPersonality = sectionPersonalities[0];
        let targetPersonality = sectionPersonalities[0];

        // Content for panels - each with personality colors
        const panelContents = [
            {
                label: 'IDENTITY',
                title: 'Eugene\nMierak',
                body: 'Frequency practitioner specializing in\nalignment caching, coherence training,\nand energetic training.',
                labelColor: '#8b6914',
                titleColor: '#c9a227',
                accentColor: '#5c4a0f'
            },
            {
                label: 'THE WORK',
                title: 'Integrative\nCoherence',
                body: 'Working through integrative coherence\nmethodologies to support clarity,\nstability, and conscious evolution.',
                labelColor: '#c9a227',
                titleColor: '#e8d48a',
                accentColor: '#8b6914'
            },
            {
                label: 'BRIDGING SCIENCES',
                title: 'Frequency\n& Frameworks',
                body: 'Bridging subtle frequency sciences with\npractical frameworks for personal,\norganizational, and planetary alignment.',
                labelColor: '#e8d48a',
                titleColor: '#fff4d6',
                accentColor: '#c9a227'
            },
            {
                label: 'SBDI FOUNDATION',
                title: 'Director of\nInternational Relations',
                body: 'Fostering global partnerships for holistic\nsustainability, regenerative development,\nand conscious collaboration across cultures.',
                labelColor: '#4a9b9b',
                titleColor: '#7ecfcf',
                accentColor: '#c9a227'
            },
            {
                label: 'MISSION',
                title: 'Coherent\nImpact',
                body: 'Supporting coherent, sustainable projects\nthrough frequency awareness and strategic\nalignment—lasting impact for communities.',
                labelColor: '#f4e9c8',
                titleColor: '#fffef5',
                accentColor: '#e8d48a'
            }
        ];

        // Panel positions in 3D space
        const panelPositions = [
            { pos: new THREE.Vector3(0, 0, 0), rot: new THREE.Vector3(0, 0, 0) },
            { pos: new THREE.Vector3(30, 4, -50), rot: new THREE.Vector3(0, -0.3, 0) },
            { pos: new THREE.Vector3(-22, -2, -100), rot: new THREE.Vector3(0, 0.25, 0) },
            { pos: new THREE.Vector3(35, 6, -160), rot: new THREE.Vector3(0, -0.35, 0) },
            { pos: new THREE.Vector3(0, 0, -220), rot: new THREE.Vector3(0, 0, 0) }
        ];

        // Create text canvas for panels with personality colors
        function createTextTexture(content, width = 700, height = 450) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Parse hex color to rgba
            function hexToRgba(hex, alpha) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            // Dark background with subtle color tint
            ctx.fillStyle = 'rgba(8, 8, 8, 0.92)';
            ctx.fillRect(0, 0, width, height);

            // Subtle gradient overlay with personality color
            const bgGradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width/2);
            bgGradient.addColorStop(0, hexToRgba(content.accentColor, 0.08));
            bgGradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Left border accent with personality color
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, hexToRgba(content.labelColor, 0));
            gradient.addColorStop(0.3, content.labelColor);
            gradient.addColorStop(0.7, content.labelColor);
            gradient.addColorStop(1, hexToRgba(content.labelColor, 0));
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 3, height);

            // Top line with personality color
            const topGradient = ctx.createLinearGradient(0, 0, width, 0);
            topGradient.addColorStop(0, hexToRgba(content.labelColor, 0));
            topGradient.addColorStop(0.2, hexToRgba(content.labelColor, 0.8));
            topGradient.addColorStop(0.8, hexToRgba(content.labelColor, 0.8));
            topGradient.addColorStop(1, hexToRgba(content.labelColor, 0));
            ctx.fillStyle = topGradient;
            ctx.fillRect(0, 0, width, 2);

            // Corner accents
            ctx.strokeStyle = hexToRgba(content.labelColor, 0.3);
            ctx.lineWidth = 1;
            // Top right corner
            ctx.beginPath();
            ctx.moveTo(width - 40, 10);
            ctx.lineTo(width - 10, 10);
            ctx.lineTo(width - 10, 40);
            ctx.stroke();
            // Bottom left corner
            ctx.beginPath();
            ctx.moveTo(10, height - 40);
            ctx.lineTo(10, height - 10);
            ctx.lineTo(40, height - 10);
            ctx.stroke();

            // Calculate vertical center
            const titleLines = content.title.split('\n');
            const bodyLines = content.body.split('\n');
            const labelHeight = 25;
            const titleHeight = titleLines.length * 55;
            const lineHeight = 25;
            const bodyHeight = bodyLines.length * 28;
            const totalHeight = labelHeight + titleHeight + lineHeight + bodyHeight;
            const startY = (height - totalHeight) / 2 + 20;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Label with personality color
            ctx.fillStyle = content.labelColor;
            ctx.font = '500 14px Montserrat, sans-serif';
            ctx.fillText(content.label, width / 2, startY);

            // Title with personality color
            ctx.fillStyle = content.titleColor;
            ctx.font = '300 48px Cormorant Garamond, serif';
            titleLines.forEach((line, i) => {
                ctx.fillText(line, width / 2, startY + 50 + i * 55);
            });

            // Decorative line with personality color
            const lineY = startY + 50 + titleLines.length * 55 + 20;
            ctx.fillStyle = content.labelColor;
            ctx.fillRect(width/2 - 40, lineY, 80, 2);

            // Small dots decoration
            ctx.fillStyle = hexToRgba(content.labelColor, 0.5);
            ctx.beginPath();
            ctx.arc(width/2 - 50, lineY + 1, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(width/2 + 50, lineY + 1, 2, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = 'rgba(220, 220, 220, 0.85)';
            ctx.font = '300 16px Montserrat, sans-serif';
            bodyLines.forEach((line, i) => {
                ctx.fillText(line, width / 2, lineY + 35 + i * 28);
            });

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // Create panels - SMALLER SIZE (aspect ratio 700:450 = 1.55)
        const panels = [];
        panelContents.forEach((content, i) => {
            const texture = createTextTexture(content);
            const geometry = new THREE.PlaneGeometry(15, 10);
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.95
            });

            const panel = new THREE.Mesh(geometry, material);
            panel.position.copy(panelPositions[i].pos);
            panel.rotation.set(
                panelPositions[i].rot.x,
                panelPositions[i].rot.y,
                panelPositions[i].rot.z
            );
            scene.add(panel);
            panels.push(panel);
        });

        // === SACRED GEOMETRY ===

        // Flower of Life
        function createFlowerOfLife(radius, circles, color) {
            const group = new THREE.Group();
            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.4
            });

            const circleGeometry = new THREE.CircleGeometry(radius, 64);
            const edges = new THREE.EdgesGeometry(circleGeometry);

            // Center circle
            const center = new THREE.LineSegments(edges, material);
            group.add(center);

            // Surrounding circles
            for (let i = 0; i < circles; i++) {
                const angle = (i / circles) * Math.PI * 2;
                const circle = new THREE.LineSegments(edges.clone(), material.clone());
                circle.position.x = Math.cos(angle) * radius;
                circle.position.y = Math.sin(angle) * radius;
                group.add(circle);
            }

            return group;
        }

        // Create multiple Flowers of Life
        for (let i = 0; i < 8; i++) {
            const flower = createFlowerOfLife(3, 6, goldColor);
            flower.position.set(
                (Math.random() - 0.5) * 120,
                (Math.random() - 0.5) * 50,
                -Math.random() * 250
            );
            flower.rotation.z = Math.random() * Math.PI;
            flower.userData.speed = { z: (Math.random() - 0.5) * 0.003 };
            scene.add(flower);
        }

        // Torus (sacred rings)
        const torusGeo = new THREE.TorusGeometry(4, 0.1, 16, 100);
        const torusMat = new THREE.MeshBasicMaterial({
            color: goldColor,
            transparent: true,
            opacity: 0.3
        });

        for (let i = 0; i < 15; i++) {
            const torus = new THREE.Mesh(torusGeo.clone(), torusMat.clone());
            torus.position.set(
                (Math.random() - 0.5) * 150,
                (Math.random() - 0.5) * 60,
                -Math.random() * 260
            );
            torus.rotation.x = Math.random() * Math.PI;
            torus.rotation.y = Math.random() * Math.PI;
            torus.userData.speed = {
                x: (Math.random() - 0.5) * 0.008,
                y: (Math.random() - 0.5) * 0.006
            };
            scene.add(torus);
        }

        // Icosahedron (sacred geometry)
        const icoGeo = new THREE.IcosahedronGeometry(2, 0);
        const icoMat = new THREE.MeshBasicMaterial({
            color: goldLight,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });

        for (let i = 0; i < 12; i++) {
            const ico = new THREE.Mesh(icoGeo.clone(), icoMat.clone());
            ico.position.set(
                (Math.random() - 0.5) * 140,
                (Math.random() - 0.5) * 50,
                -Math.random() * 250
            );
            ico.userData.speed = {
                x: (Math.random() - 0.5) * 0.005,
                y: (Math.random() - 0.5) * 0.005
            };
            scene.add(ico);
        }

        // Octahedron
        const octaGeo = new THREE.OctahedronGeometry(1.5, 0);
        const octaMat = new THREE.MeshBasicMaterial({
            color: goldColor,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });

        for (let i = 0; i < 10; i++) {
            const octa = new THREE.Mesh(octaGeo.clone(), octaMat.clone());
            octa.position.set(
                (Math.random() - 0.5) * 130,
                (Math.random() - 0.5) * 55,
                -Math.random() * 240
            );
            octa.userData.speed = {
                x: (Math.random() - 0.5) * 0.007,
                y: (Math.random() - 0.5) * 0.007
            };
            scene.add(octa);
        }

        // Golden particles
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 1200;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 200;
            positions[i + 1] = (Math.random() - 0.5) * 100;
            positions[i + 2] = -Math.random() * 300;

            // Gold color variations
            const goldVariation = 0.8 + Math.random() * 0.4;
            colors[i] = 0.79 * goldVariation;     // R
            colors[i + 1] = 0.64 * goldVariation; // G
            colors[i + 2] = 0.15 * goldVariation; // B
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 0.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Ambient light
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        // Gold point lights
        const light1 = new THREE.PointLight(0xc9a227, 1, 80);
        light1.position.set(20, 15, 10);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xe8d48a, 0.8, 100);
        light2.position.set(-30, -10, -50);
        scene.add(light2);

        // Camera path through panels - closer for smaller panels
        const cameraPath = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0, 18),
            new THREE.Vector3(28, 4, -22),
            new THREE.Vector3(-18, -1, -72),
            new THREE.Vector3(32, 6, -132),
            new THREE.Vector3(0, 0, -192)
        ], false);

        const lookAtPath = new THREE.CatmullRomCurve3([
            panelPositions[0].pos.clone(),
            panelPositions[1].pos.clone(),
            panelPositions[2].pos.clone(),
            panelPositions[3].pos.clone(),
            panelPositions[4].pos.clone()
        ], false);

        // Scroll control
        let scrollProgress = { value: 0 };
        let currentSection = 0;

        const sectionOverlay = document.getElementById('sectionOverlay');
        const sectionNameEl = document.getElementById('sectionName');

        // Apply section personality
        function applyPersonality(index, progress = 0) {
            targetPersonality = sectionPersonalities[index];

            // Update overlay color
            sectionOverlay.style.background = targetPersonality.bgOverlay;

            // Update section name
            sectionNameEl.textContent = targetPersonality.name;
            sectionNameEl.style.color = `rgba(${Math.round(targetPersonality.primary.r * 255)}, ${Math.round(targetPersonality.primary.g * 255)}, ${Math.round(targetPersonality.primary.b * 255)}, 0.5)`;

            // Update fog
            scene.fog.color.lerp(targetPersonality.fog, 0.1);

            // Update lights with personality colors
            light1.color.lerp(targetPersonality.primary, 0.05);
            light2.color.lerp(targetPersonality.accent, 0.05);

            // Update progress bar color
            const r = Math.round(targetPersonality.primary.r * 255);
            const g = Math.round(targetPersonality.primary.g * 255);
            const b = Math.round(targetPersonality.primary.b * 255);
            progressBar.style.background = `linear-gradient(90deg, rgba(${r},${g},${b},0.5), rgb(${r},${g},${b}), rgba(${r},${g},${b},0.8))`;
            progressBar.style.boxShadow = `0 0 20px rgba(${r},${g},${b},0.6)`;
        }

        gsap.to(scrollProgress, {
            value: 1,
            ease: 'none',
            scrollTrigger: {
                trigger: '.scroll-container',
                start: 'top top',
                end: 'bottom bottom',
                scrub: 1.2,
                onUpdate: (self) => {
                    progressBar.style.width = (self.progress * 100) + '%';

                    const sectionIndex = Math.min(Math.floor(self.progress * 5), 4);
                    const sectionProgress = (self.progress * 5) % 1;

                    if (sectionIndex !== currentSection) {
                        currentSection = sectionIndex;
                        pageNum.textContent = (sectionIndex + 1).toString().padStart(2, '0');
                        applyPersonality(sectionIndex, sectionProgress);
                    }

                    dots.forEach((dot, i) => {
                        dot.classList.toggle('active', i === sectionIndex);
                    });
                }
            }
        });

        // Initialize first personality
        applyPersonality(0);

        // Animation time
        let animTime = 0;

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            animTime += 0.016;

            // Camera follows path
            const t = scrollProgress.value;
            const cameraPos = cameraPath.getPoint(t);
            const lookAtPos = lookAtPath.getPoint(t);

            camera.position.lerp(cameraPos, 0.08);

            // Smooth look-at
            const targetQuat = new THREE.Quaternion();
            const tempCamera = camera.clone();
            tempCamera.lookAt(lookAtPos);
            targetQuat.copy(tempCamera.quaternion);
            camera.quaternion.slerp(targetQuat, 0.04);

            // Smoothly interpolate current personality colors
            currentPersonality.primary.lerp(targetPersonality.primary, 0.02);
            currentPersonality.secondary.lerp(targetPersonality.secondary, 0.02);

            // Breathing pulse based on personality
            const breathe = Math.sin(animTime * targetPersonality.geometryPulse) * 0.1 + 1;

            // Rotate and pulse sacred geometry with personality influence
            scene.children.forEach(child => {
                if (child.userData.speed) {
                    const speedMult = targetPersonality.geometryPulse;
                    if (child.userData.speed.x) child.rotation.x += child.userData.speed.x * speedMult;
                    if (child.userData.speed.y) child.rotation.y += child.userData.speed.y * speedMult;
                    if (child.userData.speed.z) child.rotation.z += child.userData.speed.z * speedMult;

                    // Subtle scale breathing
                    if (child.type === 'Mesh' || child.type === 'Group') {
                        child.scale.setScalar(breathe);
                    }

                    // Update geometry colors towards personality
                    if (child.material && child.material.color) {
                        child.material.color.lerp(currentPersonality.primary, 0.01);
                    }
                }
            });

            // Particles movement with personality speed
            particles.rotation.y += targetPersonality.particleSpeed;
            particles.rotation.x += targetPersonality.particleSpeed * 0.5;

            // Update particle colors gradually
            const particleColors = particles.geometry.attributes.color.array;
            for (let i = 0; i < particleColors.length; i += 3) {
                particleColors[i] = THREE.MathUtils.lerp(particleColors[i], currentPersonality.primary.r, 0.001);
                particleColors[i + 1] = THREE.MathUtils.lerp(particleColors[i + 1], currentPersonality.primary.g, 0.001);
                particleColors[i + 2] = THREE.MathUtils.lerp(particleColors[i + 2], currentPersonality.primary.b, 0.001);
            }
            particles.geometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Click dots to navigate
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                const idx = parseInt(dot.dataset.index);
                const target = (idx / 4) * (document.documentElement.scrollHeight - window.innerHeight);
                window.scrollTo({ top: target, behavior: 'smooth' });
            });
        });
        } // End init function
    </script>
</body>

</html>
