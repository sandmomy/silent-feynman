<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugene Mierak | The Weaver</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@200;300;400&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .scroll-height {
            height: 1000vh;
            position: relative;
            z-index: 0;
        }

        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, #000 120%);
        }

        .title-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 1;
            transition: opacity 0.5s;
        }

        .main-title {
            font-family: 'Italiana', serif;
            font-size: 5vw;
            letter-spacing: 0.5vw;
            background: linear-gradient(90deg, #fff, #aab, #fff);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(100, 100, 255, 0.8);
            margin-bottom: 10px;
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            font-family: 'Italiana';
            transition: opacity 1s;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">
        <div>WEAVING LIGHT...</div>
    </div>
    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="title-overlay" id="introTitle">
            <div class="main-title">EUGENE MIERAK</div>
            <div style="letter-spacing: 0.3em; font-size: 1em; opacity: 0.8; color: #aaf;">SCROLL TO BEGIN</div>
        </div>
    </div>

    <div class="scroll-height"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        try {
            gsap.registerPlugin(ScrollTrigger);

            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 90);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // --- GENERATE GLOW TEXTURE ---
            function createGlowTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.4, 'rgba(255,255,255,0.5)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 32, 32);
                const tex = new THREE.CanvasTexture(canvas);
                return tex;
            }

            // --- TEXT HELPER ---
            function getParticlesFromText(title, body) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1000; canvas.height = 1000;

                ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 1000, 1000);

                // Title
                ctx.fillStyle = '#ffffff';
                ctx.font = '700 85px Italiana';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const words = title.split('\n');
                let y = 300;
                words.forEach((w) => { ctx.fillText(w, 500, y); y += 90; });

                // Body
                ctx.font = '400 34px Montserrat';
                const mw = 850;
                const para = body.split(' ');
                let line = '';
                y += 60;
                for (let n = 0; n < para.length; n++) {
                    let testL = line + para[n] + ' ';
                    let m = ctx.measureText(testL);
                    if (m.width > mw && n > 0) { ctx.fillText(line, 500, y); line = para[n] + ' '; y += 45; }
                    else { line = testL; }
                }
                ctx.fillText(line, 500, y);

                const data = ctx.getImageData(0, 0, 1000, 1000).data;
                const points = [];
                // Grid Scan
                const step = 4;
                for (let py = 0; py < 1000; py += step) {
                    for (let px = 0; px < 1000; px += step) {
                        const alpha = data[(py * 1000 + px) * 4];
                        if (alpha > 130) {
                            points.push({
                                x: (px - 500) * 0.14,
                                y: -(py - 500) * 0.14,
                                z: 0
                            });
                        }
                    }
                }
                return points;
            }

            // --- DATA ---
            const bioData = [
                {
                    title: "Frequency\nPractitioner",
                    body: "I specialize in alignment caching, coherence training, and energetic training, working through integrative coherence methodologies to support clarity, stability, and conscious evolution.",
                    geo: "merkaba"
                },
                {
                    title: "Bridging\nWorlds",
                    body: "My work bridges subtle frequency sciences with practical frameworks for personal, organizational, and planetary alignment, helping individuals and teams cultivate resonance in real-world decisions.",
                    geo: "ico"
                },
                {
                    title: "Global\nPartnerships",
                    body: "As Director of International Relationships for the SBDI Foundation, I foster global partnerships that support holistic sustainability initiatives, regenerative development, and conscious collaboration across cultures.",
                    geo: "torus"
                },
                {
                    title: "Systems\nThinking",
                    body: "My approach grounds human potential in ecological and social responsibility, emphasizing resonance and long-term balance—so initiatives move from vision to coherent execution.",
                    geo: "helix"
                },
                {
                    title: "The\nMission",
                    body: "To support the emergence of coherent, sustainable projects through frequency awareness, strategic alignment, and conscious international cooperation—creating meaningful, lasting impact for the planet.",
                    geo: "flower"
                }
            ];

            const count = 28000;
            const shapes = [];

            // Helper to fill buffer from geometry logic
            function fillGeo(buffer, type) {
                for (let i = 0; i < count; i++) {
                    const i3 = i * 3;
                    let x, y, z;
                    if (type === 'merkaba') {
                        const s = 32; x = (Math.random() - 0.5) * s * 1.6; y = (Math.random() - 0.5) * s * 1.6; z = (Math.random() - 0.5) * s * 1.6;
                        if (Math.random() > 0.6) { if (Math.random() > 0.5) x = (Math.random() > 0.5 ? 16 : -16); else y = (Math.random() > 0.5 ? 16 : -16); }
                    } else if (type === 'ico') {
                        const r = 38; const th = Math.random() * Math.PI * 2; const ph = Math.acos(2 * Math.random() - 1);
                        x = r * Math.sin(ph) * Math.cos(th); y = r * Math.sin(ph) * Math.sin(th); z = r * Math.cos(ph);
                    } else if (type === 'torus') {
                        const R = 32, r = 12; const u = Math.random() * Math.PI * 2; const v = Math.random() * Math.PI * 2;
                        x = (R + r * Math.cos(v)) * Math.cos(u); y = (R + r * Math.cos(v)) * Math.sin(u); z = r * Math.sin(v);
                    } else if (type === 'helix') {
                        const h = (Math.random() - 0.5) * 110; const a = h * 0.35; const r = 16;
                        x = Math.cos(a) * r; y = h; z = Math.sin(a) * r;
                        if (Math.random() > 0.5) { x = Math.cos(a + Math.PI) * r; z = Math.sin(a + Math.PI) * r; }
                    } else if (type === 'flower') {
                        const r = Math.sqrt(Math.random()) * 65; const a = Math.random() * Math.PI * 2;
                        x = r * Math.cos(a); y = r * Math.sin(a); z = (Math.random() - 0.5) * 5;
                    }
                    buffer[i3] = x; buffer[i3 + 1] = y; buffer[i3 + 2] = z;
                }
            }

            bioData.forEach((item, idx) => {
                const bGeo = new Float32Array(count * 3);
                fillGeo(bGeo, item.geo);
                shapes.push(bGeo);

                const bText = new Float32Array(count * 3);
                const pts = getParticlesFromText(item.title, item.body);
                for (let i = 0; i < count; i++) {
                    const i3 = i * 3;
                    if (i < pts.length) {
                        bText[i3] = pts[i].x; bText[i3 + 1] = pts[i].y; bText[i3 + 2] = pts[i].z;
                    } else {
                        // Background Star field
                        const r = 150;
                        bText[i3] = (Math.random() - 0.5) * r; bText[i3 + 1] = (Math.random() - 0.5) * r; bText[i3 + 2] = (Math.random() - 0.5) * 80 - 40;
                    }
                }
                shapes.push(bText);
            });

            const geometry = new THREE.BufferGeometry();
            const currentPos = new Float32Array(count * 3);
            currentPos.set(shapes[0]);
            geometry.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));

            // GLOW MATERIAL
            const material = new THREE.PointsMaterial({
                color: 0xffffff, // PURE WHITE
                size: 1.5,
                map: createGlowTexture(),
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            // --- ANIMATION ---
            const totalSteps = bioData.length * 2 - 1;

            gsap.to({}, {
                scrollTrigger: {
                    trigger: ".scroll-height", start: "top top", end: "bottom bottom", scrub: 0.1,
                    onUpdate: (self) => {
                        const progress = self.progress * totalSteps;
                        const idx = Math.floor(progress);
                        const nextIdx = Math.min(idx + 1, totalSteps);
                        const mix = progress - idx;

                        const s1 = shapes[idx];
                        const s2 = shapes[nextIdx];
                        const pos = points.geometry.attributes.position.array;

                        // SPIRAL / NOISE MORPH
                        const time = Date.now() * 0.001;

                        for (let i = 0; i < count * 3; i += 3) {
                            // cubic easing
                            const m = mix < 0.5 ? 2 * mix * mix : 1 - Math.pow(-2 * mix + 2, 2) / 2;

                            // Base Lerp
                            let tx = s1[i] + (s2[i] - s1[i]) * m;
                            let ty = s1[i + 1] + (s2[i + 1] - s1[i + 1]) * m;
                            let tz = s1[i + 2] + (s2[i + 2] - s1[i + 2]) * m;

                            // Spiral chaos in the middle of transition
                            if (mix > 0.05 && mix < 0.95) {
                                const noiseAmp = Math.sin(mix * Math.PI) * 20; // Explosion amount
                                tx += Math.sin(time + i) * noiseAmp;
                                ty += Math.cos(time + i * 0.5) * noiseAmp;
                                tz += Math.sin(time + i * 0.1) * noiseAmp;
                            }

                            pos[i] = tx; pos[i + 1] = ty; pos[i + 2] = tz;
                        }
                        points.geometry.attributes.position.needsUpdate = true;

                        // Intro Fade
                        const tEl = document.getElementById('introTitle');
                        if (tEl) tEl.style.opacity = (self.progress < 0.02) ? 1 : 0;

                        // Color Shift
                        // Geo (Cyan) -> Text (Gold)
                        const isText = (nextIdx % 2 !== 0);
                        if (isText && mix > 0.5) material.color.setHex(0xffaa55); // Gold
                        else if (!isText && mix > 0.5) material.color.setHex(0x00ffff); // Cyan
                    }
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            setTimeout(() => document.getElementById('loader').classList.add('hidden'), 1500);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        } catch (e) {
            console.error(e);
        }
    </script>
</body>

</html>
