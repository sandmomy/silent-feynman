<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugene Mierak | The Journey</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        .scroll-container {
            height: 1000vh;
            /* Extra long for smooth transitions */
            position: relative;
            z-index: 0;
        }

        /* UI Overlay */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #c9a227;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #c9a227;
        }

        /* Progress Line */
        .timeline {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            height: 40vh;
            width: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .timeline-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to bottom, #c9a227, #f4e9c8);
            height: 0%;
            box-shadow: 0 0 10px #c9a227;
        }

        /* Chapter Indicators */
        .chapter-indicator {
            position: fixed;
            left: 40px;
            bottom: 40px;
            font-family: 'Cinzel', serif;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            letter-spacing: 3px;
        }

        .chapter-current {
            color: #c9a227;
            font-size: 1.5rem;
            margin-right: 10px;
        }

        /* Loading */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #c9a227;
            font-family: 'Cinzel', serif;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .loader.hidden {
            opacity: 0;
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">INITIALIZING JOURNEY...</div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <nav>
            <a href="#" class="logo">EUGENE MIERAK</a>
            <div class="nav-links">
                <a href="#">About</a>
                <a href="#">Work</a>
                <a href="#">Contact</a>
            </div>
        </nav>

        <div class="timeline">
            <div class="timeline-fill" id="progressFill"></div>
        </div>

        <div class="chapter-indicator">
            <span class="chapter-current" id="chapterNum">I</span>
            <span id="chapterName">CHAOS</span>
        </div>
    </div>

    <div class="scroll-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Three.js Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.015); // Start with dense fog

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // === CONTENT PANELS (Real 3D Objects) ===

        const panelContents = [
            {
                label: 'IDENTITY',
                title: 'Eugene\nMierak',
                body: 'Frequency practitioner specializing in\nalignment caching, coherence training,\nand energetic training.'
            },
            {
                label: 'THE WORK',
                title: 'Integrative\nCoherence',
                body: 'Working through integrative coherence\nmethodologies to support clarity,\nstability, and conscious evolution.'
            },
            {
                label: 'BRIDGING SCIENCES',
                title: 'Frequency\n& Frameworks',
                body: 'Bridging subtle frequency sciences with\npractical frameworks for personal,\norganizational, and planetary alignment.'
            },
            {
                label: 'SBDI FOUNDATION',
                title: 'Director of\nIntl. Relations',
                body: 'Fostering global partnerships for holistic\nsustainability, regenerative development,\nand conscious collaboration across cultures.'
            },
            {
                label: 'MISSION',
                title: 'Coherent\nImpact',
                body: 'Supporting coherent, sustainable projects\nthrough frequency awareness and strategic\nalignment—lasting impact for communities.'
            }
        ];

        // Panel positions along the path (Z-depth mostly)
        const panelPositions = [
            new THREE.Vector3(0, 0, -20),   // Start
            new THREE.Vector3(15, 2, -120), // Order
            new THREE.Vector3(-15, -2, -220),// Resonance
            new THREE.Vector3(0, 5, -350),  // Global
            new THREE.Vector3(0, 0, -500)   // Impact
        ];

        // Helper to create texture for panels
        function createTextTexture(content) {
            const canvas = document.createElement('canvas');
            canvas.width = 1000;
            canvas.height = 700;
            const ctx = canvas.getContext('2d');

            // Glass background
            ctx.fillStyle = 'rgba(10, 10, 12, 0.85)';
            ctx.fillRect(0, 0, 1000, 700);

            // Border
            ctx.strokeStyle = '#c9a227';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, 980, 680);

            // Label
            ctx.fillStyle = '#c9a227';
            ctx.font = '600 24px Montserrat';
            ctx.letterSpacing = '4px';
            ctx.fillText(content.label, 60, 80);

            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = '400 90px Cinzel';
            const titleLines = content.title.split('\n');
            titleLines.forEach((line, i) => {
                ctx.fillText(line, 60, 200 + i * 110);
            });

            // Body
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = '300 32px Montserrat';
            const bodyLines = content.body.split('\n');
            bodyLines.forEach((line, i) => {
                ctx.fillText(line, 60, 200 + (titleLines.length * 110) + 40 + i * 50);
            });

            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        // Create Panel Meshes
        const panels = [];
        panelContents.forEach((c, i) => {
            const tex = createTextTexture(c);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
            const geo = new THREE.PlaneGeometry(30, 21);
            const mesh = new THREE.Mesh(geo, mat);

            mesh.position.copy(panelPositions[i]);
            // Tiny random rotation for organic feel
            mesh.rotation.x = (Math.random() - 0.5) * 0.2;
            mesh.rotation.y = (Math.random() - 0.5) * 0.2;

            scene.add(mesh);
            panels.push(mesh);
        });


        // === ENVIRONMENT SCENES ===

        // 1. CHAOS (Asteroids)
        const rocksGroup = new THREE.Group();
        const rockGeo = new THREE.DodecahedronGeometry(1, 0);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 });
        for (let i = 0; i < 400; i++) {
            const rock = new THREE.Mesh(rockGeo, rockMat);
            rock.position.set((Math.random() - 0.5) * 150, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100 - 20);
            rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            rock.scale.setScalar(Math.random() * 2 + 0.5);
            rocksGroup.add(rock);
        }
        scene.add(rocksGroup);

        // 2. ORDER (Crystals)
        const crystalsGroup = new THREE.Group();
        const crystGeo = new THREE.OctahedronGeometry(1.5, 0);
        const crystMat = new THREE.MeshStandardMaterial({ color: 0x4169e1, roughness: 0.1, metalness: 0.8 });
        // Arrange in tunnel around path
        for (let i = 0; i < 40; i++) {
            const angle = (i / 40) * Math.PI * 8; // Spiral
            const r = 20;
            const c = new THREE.Mesh(crystGeo, crystMat);
            c.position.set(Math.cos(angle) * r, Math.sin(angle) * r, -100 - (i * 3));
            c.rotation.y = Math.random() * Math.PI;
            crystalsGroup.add(c);
        }
        scene.add(crystalsGroup);

        // 3. RESONANCE (Rings)
        const resonanceGroup = new THREE.Group();
        const ringGeo = new THREE.TorusGeometry(25, 0.3, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xc9a227, transparent: true, opacity: 0.2 });
        for (let i = 0; i < 10; i++) {
            const r = new THREE.Mesh(ringGeo, ringMat);
            r.position.z = -200 - (i * 15);
            r.rotation.z = i * 0.2;
            resonanceGroup.add(r);
        }
        scene.add(resonanceGroup);

        // 4. GLOBAL (Network Sphere)
        const globalGroup = new THREE.Group();
        const sphereGeo = new THREE.IcosahedronGeometry(20, 2);
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.1 });
        const sphere = new THREE.Mesh(sphereGeo, wireMat);
        globalGroup.add(sphere);
        // Particles on nodes
        const pGeo = new THREE.BufferGeometry().setAttribute('position', sphereGeo.getAttribute('position'));
        const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 });
        const pMesh = new THREE.Points(pGeo, pMat);
        globalGroup.add(pMesh);
        globalGroup.position.z = -350;
        scene.add(globalGroup);

        // 5. IMPACT (Light Core)
        const impactGroup = new THREE.Group();
        const coreGeo = new THREE.SphereGeometry(2, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        const spriteMat = new THREE.SpriteMaterial({ color: 0xffaa00, blending: THREE.AdditiveBlending });
        const glow = new THREE.Sprite(spriteMat);
        glow.scale.set(60, 60, 1);
        impactGroup.add(core);
        impactGroup.add(glow);
        impactGroup.position.z = -520;
        scene.add(impactGroup);


        // Lights
        const ambLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambLight);
        const pLight = new THREE.PointLight(0xffffff, 1, 100);
        scene.add(pLight); // Will move with camera

        // Camera Path
        const pathPoints = [
            new THREE.Vector3(0, 0, 10),      // Start
            new THREE.Vector3(5, 0, -100),    // Order
            new THREE.Vector3(-5, 0, -200),   // Resonance
            new THREE.Vector3(0, 0, -350),    // Global
            new THREE.Vector3(0, 0, -500)     // Impact
        ];
        const camPath = new THREE.CatmullRomCurve3(pathPoints);


        // SCROLL LOGIC
        let scrollProgress = { val: 0 };
        const chNum = document.getElementById('chapterNum');
        const chName = document.getElementById('chapterName');
        const chapters = ['I', 'II', 'III', 'IV', 'V'];
        const names = ['ORIGIN', 'STRUCTURE', 'RESONANCE', 'GLOBAL', 'IMPACT'];

        gsap.to(scrollProgress, {
            val: 1,
            ease: 'none',
            scrollTrigger: {
                trigger: '.scroll-container',
                start: 'top top',
                end: 'bottom bottom',
                scrub: 1,
                onUpdate: (self) => {
                    const p = self.progress;
                    document.getElementById('progressFill').style.height = (p * 100) + '%';

                    // Update Chapter UI
                    const idx = Math.min(Math.floor(p * 5), 4);
                    chNum.textContent = chapters[idx];
                    chName.textContent = names[idx];

                    // Transition scenes visibility/opacity roughly based on progress
                    // (Simple fade in/out logic)
                    rocksGroup.visible = p < 0.3;
                    crystalsGroup.visible = p > 0.1 && p < 0.5;
                    resonanceGroup.visible = p > 0.3 && p < 0.7;
                    globalGroup.visible = p > 0.5 && p < 0.9;
                    impactGroup.visible = p > 0.7;

                    // Rotate groups for liveliness
                    rocksGroup.rotation.y = p;
                    crystalsGroup.rotation.z = p * 2;
                    globalGroup.rotation.y = p * 3;
                }
            }
        });

        // Loop
        function animate() {
            requestAnimationFrame(animate);

            // Move camera
            const t = scrollProgress.val;
            const pos = camPath.getPointAt(t);
            // Look slightly ahead
            const lookAt = camPath.getPointAt(Math.min(t + 0.05, 1));

            camera.position.lerp(pos, 0.1);
            camera.lookAt(lookAt);

            // Move light with camera
            pLight.position.copy(camera.position);

            // Face panels to camera always
            panels.forEach(p => p.lookAt(camera.position));

            renderer.render(scene, camera);
        }

        animate();

        // Remove loader
        setTimeout(() => {
            document.getElementById('loader').classList.add('hidden');
        }, 1000);

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
