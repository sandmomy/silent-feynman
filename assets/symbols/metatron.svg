<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" transform="translate(100,100)">
    <!-- All connecting lines between 13 nodes -->
    <!-- Center to inner ring -->
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#b38f26" stroke-width="0.4" opacity="0.4"/>
    <line x1="0" y1="0" x2="30.3" y2="-17.5" stroke="#b38f26" stroke-width="0.4" opacity="0.4"/>
    <line x1="0" y1="0" x2="30.3" y2="17.5" stroke="#b38f26" stroke-width="0.4" opacity="0.4"/>
    <line x1="0" y1="0" x2="0" y2="35" stroke="#b38f26" stroke-width="0.4" opacity="0.4"/>
    <line x1="0" y1="0" x2="-30.3" y2="17.5" stroke="#b38f26" stroke-width="0.4" opacity="0.4"/>
    <line x1="0" y1="0" x2="-30.3" y2="-17.5" stroke="#b38f26" stroke-width="0.4" opacity="0.4"/>
    <!-- Inner ring interconnections -->
    <line x1="0" y1="-35" x2="30.3" y2="-17.5" stroke="#b38f26" stroke-width="0.35" opacity="0.35"/>
    <line x1="30.3" y1="-17.5" x2="30.3" y2="17.5" stroke="#b38f26" stroke-width="0.35" opacity="0.35"/>
    <line x1="30.3" y1="17.5" x2="0" y2="35" stroke="#b38f26" stroke-width="0.35" opacity="0.35"/>
    <line x1="0" y1="35" x2="-30.3" y2="17.5" stroke="#b38f26" stroke-width="0.35" opacity="0.35"/>
    <line x1="-30.3" y1="17.5" x2="-30.3" y2="-17.5" stroke="#b38f26" stroke-width="0.35" opacity="0.35"/>
    <line x1="-30.3" y1="-17.5" x2="0" y2="-35" stroke="#b38f26" stroke-width="0.35" opacity="0.35"/>
    <!-- Inner to outer ring connections -->
    <line x1="0" y1="-35" x2="0" y2="-70" stroke="#b38f26" stroke-width="0.3" opacity="0.3"/>
    <line x1="30.3" y1="-17.5" x2="60.6" y2="-35" stroke="#b38f26" stroke-width="0.3" opacity="0.3"/>
    <line x1="30.3" y1="17.5" x2="60.6" y2="35" stroke="#b38f26" stroke-width="0.3" opacity="0.3"/>
    <line x1="0" y1="35" x2="0" y2="70" stroke="#b38f26" stroke-width="0.3" opacity="0.3"/>
    <line x1="-30.3" y1="17.5" x2="-60.6" y2="35" stroke="#b38f26" stroke-width="0.3" opacity="0.3"/>
    <line x1="-30.3" y1="-17.5" x2="-60.6" y2="-35" stroke="#b38f26" stroke-width="0.3" opacity="0.3"/>
    <!-- Outer ring interconnections -->
    <line x1="0" y1="-70" x2="60.6" y2="-35" stroke="#b38f26" stroke-width="0.25" opacity="0.25"/>
    <line x1="60.6" y1="-35" x2="60.6" y2="35" stroke="#b38f26" stroke-width="0.25" opacity="0.25"/>
    <line x1="60.6" y1="35" x2="0" y2="70" stroke="#b38f26" stroke-width="0.25" opacity="0.25"/>
    <line x1="0" y1="70" x2="-60.6" y2="35" stroke="#b38f26" stroke-width="0.25" opacity="0.25"/>
    <line x1="-60.6" y1="35" x2="-60.6" y2="-35" stroke="#b38f26" stroke-width="0.25" opacity="0.25"/>
    <line x1="-60.6" y1="-35" x2="0" y2="-70" stroke="#b38f26" stroke-width="0.25" opacity="0.25"/>
    <!-- Cross connections (star pattern) -->
    <line x1="0" y1="-70" x2="60.6" y2="35" stroke="#b38f26" stroke-width="0.2" opacity="0.2"/>
    <line x1="0" y1="-70" x2="-60.6" y2="35" stroke="#b38f26" stroke-width="0.2" opacity="0.2"/>
    <line x1="60.6" y1="-35" x2="-60.6" y2="35" stroke="#b38f26" stroke-width="0.2" opacity="0.2"/>
    <line x1="60.6" y1="-35" x2="0" y2="70" stroke="#b38f26" stroke-width="0.2" opacity="0.2"/>
    <line x1="60.6" y1="35" x2="-60.6" y2="-35" stroke="#b38f26" stroke-width="0.2" opacity="0.2"/>
    <line x1="0" y1="70" x2="-60.6" y2="-35" stroke="#b38f26" stroke-width="0.2" opacity="0.2"/>
    <!-- Node circles - outer ring -->
    <circle cx="0" cy="-70" r="5" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.7"/>
    <circle cx="60.6" cy="-35" r="5" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.7"/>
    <circle cx="60.6" cy="35" r="5" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.7"/>
    <circle cx="0" cy="70" r="5" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.7"/>
    <circle cx="-60.6" cy="35" r="5" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.7"/>
    <circle cx="-60.6" cy="-35" r="5" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.7"/>
    <!-- Node circles - inner ring -->
    <circle cx="0" cy="-35" r="4" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.8"/>
    <circle cx="30.3" cy="-17.5" r="4" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.8"/>
    <circle cx="30.3" cy="17.5" r="4" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.8"/>
    <circle cx="0" cy="35" r="4" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.8"/>
    <circle cx="-30.3" cy="17.5" r="4" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.8"/>
    <circle cx="-30.3" cy="-17.5" r="4" stroke="#00cc99" stroke-width="0.8" fill="none" opacity="0.8"/>
    <!-- Center node -->
    <circle cx="0" cy="0" r="3.5" stroke="#ffcaa0" stroke-width="1" fill="none" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffcaa0" opacity="0.6"/>
  </g>
</svg>
