<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" transform="translate(100,100)">
    <!-- Outer ellipse (torus profile) -->
    <ellipse cx="0" cy="0" rx="80" ry="55" stroke="#345959" stroke-width="0.6" opacity="0.5"/>
    <!-- Inner ellipse (hole) -->
    <ellipse cx="0" cy="0" rx="25" ry="12" stroke="#8a6e38" stroke-width="0.7" opacity="0.6"/>
    <!-- Meridian lines (vertical cross-sections) -->
    <ellipse cx="0" cy="0" rx="52" ry="55" stroke="#345959" stroke-width="0.35" opacity="0.3" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="52" ry="55" stroke="#345959" stroke-width="0.35" opacity="0.25" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="52" ry="55" stroke="#345959" stroke-width="0.35" opacity="0.25" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="52" ry="55" stroke="#345959" stroke-width="0.35" opacity="0.25" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="52" ry="55" stroke="#345959" stroke-width="0.35" opacity="0.25" transform="rotate(120)"/>
    <ellipse cx="0" cy="0" rx="52" ry="55" stroke="#345959" stroke-width="0.35" opacity="0.25" transform="rotate(150)"/>
    <!-- Horizontal rings (latitude lines) -->
    <ellipse cx="0" cy="-35" rx="55" ry="15" stroke="#7a7a7a" stroke-width="0.3" opacity="0.2"/>
    <ellipse cx="0" cy="-18" rx="72" ry="20" stroke="#7a7a7a" stroke-width="0.3" opacity="0.25"/>
    <ellipse cx="0" cy="0" rx="80" ry="22" stroke="#7a7a7a" stroke-width="0.35" opacity="0.3"/>
    <ellipse cx="0" cy="18" rx="72" ry="20" stroke="#7a7a7a" stroke-width="0.3" opacity="0.25"/>
    <ellipse cx="0" cy="35" rx="55" ry="15" stroke="#7a7a7a" stroke-width="0.3" opacity="0.2"/>
    <!-- Energy flow lines (spiral paths through center) -->
    <path d="M0,-55 C30,-40 35,-15 25,0 C15,15 30,40 0,55" stroke="#2a5a5a" stroke-width="0.5" opacity="0.4"/>
    <path d="M0,-55 C-30,-40 -35,-15 -25,0 C-15,15 -30,40 0,55" stroke="#2a5a5a" stroke-width="0.5" opacity="0.4"/>
    <!-- Center glow point -->
    <circle cx="0" cy="0" r="3" fill="#8a6e38" opacity="0.5"/>
    <circle cx="0" cy="-55" r="2" fill="#8a6e38" opacity="0.3"/>
    <circle cx="0" cy="55" r="2" fill="#8a6e38" opacity="0.3"/>
  </g>
</svg>
